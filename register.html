<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZyntraCode - S'inscrire</title>
<link rel="icon" type="image/png" href="logo_zyntracode2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;
  --panel:#101213;
  --panel-2:#15181a;
  --border:#222625;
  --accent:#15d5a8;
  --accent-rgb:21,213,168;
  --purple:#c586c0;
  --text:#e9e9e9;
  --text-dim:#8a9290;
  --sans:'Inter',Arial,sans-serif;
  --display:'Space Grotesk',var(--sans);
  --mono:'JetBrains Mono',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden;position:relative;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 0 30px 210px;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px;}

/* ---------- ambiance de fond ---------- */
.bg-grid{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:42px 42px;mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,black 40%,transparent 90%);}
.bg-glow{position:fixed;inset:0;z-index:-3;pointer-events:none;overflow:hidden;}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.18;animation:float 16s ease-in-out infinite;}
.blob-1{width:480px;height:480px;background:var(--accent);top:-120px;left:10%;}
.blob-2{width:380px;height:380px;background:var(--purple);bottom:-140px;right:5%;animation-delay:-8s;}
@keyframes float{0%,100%{transform:translate(0,0);}50%{transform:translate(40px,-50px);}}
@keyframes blink{50%{opacity:0;}}

/* ---------- sidebar / nav ---------- */
#menu-btn{
  position:fixed;top:14px;left:14px;z-index:1001;display:none;
  background:var(--panel);border:1px solid var(--border);color:var(--accent);
  font-family:var(--mono);font-size:14px;padding:9px 14px;border-radius:6px;cursor:pointer;transition:.2s;
}
#menu-btn:hover{border-color:var(--accent);box-shadow:0 0 14px rgba(var(--accent-rgb),.25);}
#menu{
  background:var(--panel);width:210px;height:100vh;position:fixed;top:0;left:0;z-index:1000;
  border-right:1px solid var(--border);padding:26px 14px 14px 14px;transition:.3s;display:flex;flex-direction:column;
}
.brand{font-family:var(--mono);font-weight:600;color:var(--text);font-size:15px;padding:0 10px 22px 10px;border-bottom:1px solid var(--border);margin-bottom:14px;letter-spacing:.3px;text-align:left;}
.brand span{color:var(--accent);}
.cursor-blink{display:inline-block;width:8px;background:var(--accent);margin-left:2px;animation:blink 1s steps(1) infinite;}
.nav-label{font-family:var(--mono);font-size:11px;color:var(--text-dim);padding:4px 10px 8px;letter-spacing:.5px;text-align:left;}
#menu a{
  color:#c7cccb;display:flex;align-items:center;gap:8px;padding:10px 10px;margin-bottom:2px;
  text-decoration:none;border-radius:6px;font-size:14px;transition:.18s;border-left:2px solid transparent;text-align:left;
}
#menu a:hover{color:var(--accent);background:var(--panel-2);border-left-color:var(--accent);padding-left:13px;}
#menu a.active{color:var(--accent);background:var(--panel-2);border-left-color:var(--accent);}
.menu-jeux-wrapper{position:relative;}
.menu-jeux-titre{
  color:#c7cccb;display:flex;align-items:center;gap:8px;padding:10px 10px;text-decoration:none;
  border-radius:6px;cursor:pointer;user-select:none;font-size:14px;transition:.18s;border-left:2px solid transparent;text-align:left;
}
.menu-jeux-titre:hover{color:var(--accent);background:var(--panel-2);border-left-color:var(--accent);}
.menu-jeux-dropdown{max-height:0;overflow:hidden;transition:max-height .3s ease;background:#0c0e0d;border-radius:6px;}
.menu-jeux-wrapper:hover .menu-jeux-dropdown{max-height:200px;}
.menu-jeux-dropdown a{
  color:#8a9290!important;padding:9px 10px 9px 26px!important;font-size:12.5px!important;
  font-family:var(--mono);border-left:2px solid var(--border);margin:2px 0;border-radius:0!important;text-align:left;
}
.menu-jeux-dropdown a:hover{color:var(--accent)!important;background:var(--panel-2)!important;border-left-color:var(--accent);}
.menu-bottom{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);}

/* ---------- carte inscription ---------- */
.card-wrap{padding:0 24px;width:100%;max-width:440px;}
.terminal{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.02);position:relative;}
.terminal::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0px,rgba(255,255,255,.012) 1px,transparent 1px,transparent 3px);}
.term-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel-2);border-bottom:1px solid var(--border);}
.dot{width:10px;height:10px;border-radius:50%;}
.dot.r{background:#ff5f56;}.dot.y{background:#ffbd2e;}.dot.g{background:#27c93f;}
.term-tab{margin-left:10px;font-family:var(--mono);font-size:12px;color:var(--text-dim);}
.card{padding:30px 28px 32px;}
.card h2{font-family:var(--display);font-weight:700;font-size:25px;text-align:center;margin-bottom:6px;
  background:linear-gradient(135deg,#fff 30%,var(--accent) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.sous-titre{color:var(--text-dim);font-size:13.5px;text-align:center;margin-bottom:26px;font-family:var(--mono);}
.champ{margin-bottom:16px;}
.champ label{display:flex;align-items:center;gap:6px;color:var(--text);font-size:13px;margin-bottom:8px;font-family:var(--mono);}
.champ label::before{content:'//';color:var(--accent);}
.champ input{
  width:100%;padding:11px 14px;background:#0c0e0d;border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:14px;font-family:var(--sans);outline:none;transition:.2s;
}
.champ input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.12);}
#username-hint{color:var(--text-dim);font-size:11.5px;margin-top:6px;display:block;font-family:var(--mono);line-height:1.4;}
.force-barre{display:flex;gap:4px;margin-top:8px;}
.force-barre div{flex:1;height:4px;background:var(--border);border-radius:2px;transition:background .3s;}
.btn-submit{
  width:100%;padding:13px;background:var(--accent);color:#06140f;border:1px solid var(--accent);
  border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:.22s;margin-top:6px;font-family:var(--sans);
}
.btn-submit:hover{background:transparent;color:var(--accent);box-shadow:0 0 22px rgba(var(--accent-rgb),.3);transform:translateY(-2px);}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none;}
.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:15px;display:none;text-align:center;font-family:var(--mono);}
.msg.erreur{background:rgba(255,77,77,.1);border:1px solid #ff4d4d;color:#ff7a7a;}
.msg.succes{background:rgba(var(--accent-rgb),.1);border:1px solid var(--accent);color:var(--accent);}
.lien-bas{text-align:center;margin-top:20px;font-size:13.5px;color:var(--text-dim);}
.lien-bas a{color:var(--accent);text-decoration:none;}
.lien-bas a:hover{text-decoration:underline;}

/* ---------- mobile ---------- */
@media (max-width:768px){
  body{padding-left:0;}
  #menu-btn{display:block;}
  #menu{display:none;}
  #menu.visible{display:flex;}
  .card-wrap{padding:0 20px;}
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>

<button id="menu-btn">[ menu ]</button>

<nav id="menu">
  <div class="brand">Zyntra<span>Code</span><span class="cursor-blink"></span></div>
  <div class="nav-label">// navigation</div>
  <a href="index.html">Accueil</a>
  <a href="2-script.html">Script</a>
  <a href="3-contact.html">Contact</a>
  <a href="10-e-book.html">E-book</a>

  <div class="menu-jeux-wrapper">
    <span class="menu-jeux-titre">🎮 Jeux ▾</span>
    <div class="menu-jeux-dropdown">
      <a href="morpion.html">⭕ Morpion</a>
      <a href="clash_arena.html">🕌 Zyntra Arena</a>
    </div>
  </div>

  <div class="menu-bottom">
    <a href="login.html">🔐 Se connecter</a>
  </div>
</nav>

<div class="card-wrap reveal">
  <div class="terminal">
    <div class="term-bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="term-tab">register.sh</span>
    </div>
    <div class="card">
      <h2>Inscription</h2>
      <p class="sous-titre">Rejoins ZyntraCode, c'est gratuit !</p>

      <div class="msg erreur" id="msg-erreur"></div>
      <div class="msg succes" id="msg-succes"></div>

      <div class="champ">
        <label>nom_utilisateur</label>
        <input type="text" id="username" placeholder="Gamer_456" oninput="validerUsername(this.value)">
        <small id="username-hint">Minimum 3 caractères · lettres, chiffres et _ uniquement · pas d'espaces, pas votre vrai prénom</small>
      </div>
      <div class="champ">
        <label>email</label>
        <input type="email" id="email" placeholder="toi@exemple.com">
      </div>
      <div class="champ">
        <label>mot_de_passe</label>
        <input type="password" id="password" placeholder="••••••••" oninput="verifierForce(this.value)">
        <div class="force-barre">
          <div id="b1"></div>
          <div id="b2"></div>
          <div id="b3"></div>
          <div id="b4"></div>
        </div>
      </div>
      <div class="champ">
        <label>confirmer_mot_de_passe</label>
        <input type="password" id="password2" placeholder="••••••••">
      </div>

      <button class="btn-submit" id="btn-inscription" onclick="register()">Créer mon compte</button>

      <div class="lien-bas">
        Déjà un compte ? <a href="login.html">Se connecter</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // Initialisation Supabase
    const { createClient } = supabase;
    const supabaseClient = createClient(
        'https://nvvpvwqcjqujyzvdimix.supabase.co',
        'sb_publishable_7oQ8rUh7OCE0Uo-DUwSUcw_CKOPnCU4'
    );

    const btn = document.getElementById("menu-btn");
    const menu = document.getElementById("menu");
    btn.addEventListener("click", () => menu.classList.toggle("visible"));

    function verifierForce(val) {
        const couleurs = ["#ff4d4d", "#ffaa00", "rgb(21,213,168)", "rgb(21,213,168)"];
        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 10) score++;
        if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        for (let i = 1; i <= 4; i++) {
            document.getElementById("b" + i).style.background = i <= score ? couleurs[score - 1] : "#2a2a2a";
        }
    }

    function afficherErreur(msg) {
        const el = document.getElementById("msg-erreur");
        el.textContent = msg;
        el.style.display = "block";
        document.getElementById("msg-succes").style.display = "none";
    }

    function afficherSucces(msg) {
        const el = document.getElementById("msg-succes");
        el.textContent = msg;
        el.style.display = "block";
        document.getElementById("msg-erreur").style.display = "none";
    }

    function validerUsername(val) {
        const hint = document.getElementById("username-hint");
        if (val.length === 0) {
            hint.style.color = "#8a9290";
        } else if (val.length < 3 || !/^[a-zA-Z0-9_]+$/.test(val)) {
            hint.style.color = "#ff4d4d";
        } else {
            hint.style.color = "rgb(21,213,168)";
        }
    }

    async function register() {
        const username = document.getElementById("username").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const password2 = document.getElementById("password2").value;

        if (!username || !email || !password || !password2) return afficherErreur("Remplis tous les champs.");
        if (username.length < 3) return afficherErreur("Le pseudo doit faire minimum 3 caractères.");
        if (!/^[a-zA-Z0-9_]+$/.test(username)) return afficherErreur("Le pseudo ne peut contenir que des lettres, chiffres et _ (pas d'espaces).");
        if (password !== password2) return afficherErreur("Les mots de passe ne correspondent pas.");
        if (password.length < 6) return afficherErreur("Mot de passe trop court (6 caractères minimum).");

        const btnEl = document.getElementById("btn-inscription");
        btnEl.disabled = true;
        btnEl.textContent = "Création...";

        const { error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { username } }
        });

        if (error) {
            afficherErreur(error.message === "User already registered" ? "Cet email est déjà utilisé." : error.message);
            btnEl.disabled = false;
            btnEl.textContent = "Créer mon compte";
        } else {
            afficherSucces("Compte créé ! Vérifie ton email pour confirmer.");
            btnEl.textContent = "Compte créé ✓";
        }
    }
</script>
<script src="mise-a-jour.js"></script>

</body>
</html>
