<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpion Spatial Tactique</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            background-color: #1a1a1a;
            color: white;
            margin-top: 20px;
        }
        h1 { color: #00ffcc; margin-bottom: 10px; }
        .menu-options { margin-bottom: 15px; }
        .btn-mode {
            padding: 10px 20px;
            font-size: 16px;
            margin: 0 10px;
            border: 2px solid #555;
            background-color: #222;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-mode.actif {
            background-color: #00ffcc;
            color: black;
            border-color: #00ffcc;
        }
        .select-difficulte {
            padding: 8px 12px;
            font-size: 15px;
            background-color: #333;
            color: white;
            border: 2px solid #555;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .affichage-score {
            font-size: 18px;
            color: #aaa;
            margin: 10px 0;
        }
        #statut {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
            height: 35px;
        }
        .grille {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .case {
            width: 100px;
            height: 100px;
            background-color: #333;
            border: 2px solid #555;
            font-size: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            border-radius: 10px;
            transition: background 0.3s;
        }
        .case:hover { background-color: #444; }
        button#btn-recommencer {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #ffffff;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button#btn-recommencer:hover { background-color: #dddddd; }
    </style>
</head>
<body>

    <h1>Morpion Tactique</h1>
    
    <div class="menu-options">
        <button id="modeSolo" class="btn-mode actif" onclick="changerMode('solo')">Mode Solo (vs Robot)</button>
        <button id="modeDuo" class="btn-mode" onclick="changerMode('duo')">Mode Duo (2 Joueurs)</button>
        
        <select id="difficulte" class="select-difficulte" onchange="recommencer()">
            <option value="facile">Difficulté : Facile 🟢</option>
            <option value="normal">Difficulté : Normal 🟡</option>
            <option value="difficile" selected>Difficulté : Difficile 🔴</option>
        </select>
    </div>

    <div class="affichage-score" id="tableauScore">Score : Toi 0 - 0 Robot</div>

    <div id="statut">À toi de jouer ! (Tu es les X)</div>

    <div class="grille">
        <button class="case" id="b0" onclick="jouerCase(0)"></button>
        <button class="case" id="b1" onclick="jouerCase(1)"></button>
        <button class="case" id="b2" onclick="jouerCase(2)"></button>
        <button class="case" id="b3" onclick="jouerCase(3)"></button>
        <button class="case" id="b4" onclick="jouerCase(4)"></button>
        <button class="case" id="b5" onclick="jouerCase(5)"></button>
        <button class="case" id="b6" onclick="jouerCase(6)"></button>
        <button class="case" id="b7" onclick="jouerCase(7)"></button>
        <button class="case" id="b8" onclick="jouerCase(8)"></button>
    </div>

    <button id="btn-recommencer" onclick="recommencer()">Réinitialiser</button>

    <script>
        let modeActuel = "solo";
        let joueurActuel = "X"; 
        let partieFinie = false;
        let grille = ["", "", "", "", "", "", "", "", ""]; 

        let scoreHumain = 0;
        let scoreRobot = 0;

        function changerMode(nouveauMode) {
            modeActuel = nouveauMode;
            document.getElementById("modeSolo").classList.remove("actif");
            document.getElementById("modeDuo").classList.remove("actif");
            
            const selectDiff = document.getElementById("difficulte");
            
            if (modeActuel === "solo") {
                document.getElementById("modeSolo").classList.add("actif");
                selectDiff.style.display = "inline-block";
                document.getElementById("tableauScore").innerText = `Score : Toi ${scoreHumain} - ${scoreRobot} Robot`;
            } else {
                document.getElementById("modeDuo").classList.add("actif");
                selectDiff.style.display = "none";
                document.getElementById("tableauScore").innerText = "Mode 2 Joueurs Local";
            }
            recommencer();
        }

        function jouerCase(index) {
            if (partieFinie || grille[index] !== "") return;
            if (modeActuel === "solo" && joueurActuel !== "X") return;

            validerCoup(index, joueurActuel, joueurActuel === "X" ? "#00ffcc" : "#ff3366");

            if (verifierFinPartie()) return;

            if (modeActuel === "duo") {
                joueurActuel = (joueurActuel === "X") ? "O" : "X";
                document.getElementById("statut").innerText = `Tour du joueur : ${joueurActuel}`;
            } 
            else if (modeActuel === "solo") {
                joueurActuel = "O";
                document.getElementById("statut").innerText = "Le robot réfléchit...";
                setTimeout(tourIA, 400); 
            }
        }

        function tourIA() {
            if (partieFinie || modeActuel !== "solo") return;

            let niveau = document.getElementById("difficulte").value;
            let caseChoisie = null;

            if (niveau === "difficile") {
                caseChoisie = trouverCaseCle("O"); 
                if (caseChoisie === null) caseChoisie = trouverCaseCle("X"); 
                if (caseChoisie === null && grille[4] === "") caseChoisie = 4; 
            } 
            else if (niveau === "normal") {
                caseChoisie = trouverCaseCle("X"); 
            }

            if (caseChoisie === null) {
                let casesVides = [];
                for (let i = 0; i < 9; i++) {
                    if (grille[i] === "") casesVides.push(i);
                }
                if (casesVides.length > 0) {
                    let indexAuHasard = Math.floor(Math.random() * casesVides.length);
                    caseChoisie = casesVides[indexAuHasard];
                }
            }

            if (caseChoisie !== null) {
                validerCoup(caseChoisie, "O", "#ff3366");
                if (verifierFinPartie()) return;
            }

            joueurActuel = "X";
            document.getElementById("statut").innerText = "À toi de jouer ! (Tu es les X)";
        }

        function testerLigne(a, b, c, symbole) {
            let cpt = 0;
            if (grille[a] === symbole) cpt++;
            if (grille[b] === symbole) cpt++;
            if (grille[c] === symbole) cpt++;
            if (cpt === 2) {
                if (grille[a] === "") return a;
                if (grille[b] === "") return b;
                if (grille[c] === "") return c;
            }
            return null;
        }

        function trouverCaseCle(symbole) {
            let res = null;
            res = testerLigne(0, 1, 2, symbole); if (res !== null) return res;
            res = testerLigne(3, 4, 5, symbole); if (res !== null) return res;
            res = testerLigne(6, 7, 8, symbole); if (res !== null) return res;
            res = testerLigne(0, 3, 6, symbole); if (res !== null) return res;
            res = testerLigne(1, 4, 7, symbole); if (res !== null) return res;
            res = testerLigne(2, 5, 8, symbole); if (res !== null) return res;
            res = testerLigne(0, 4, 8, symbole); if (res !== null) return res;
            res = testerLigne(2, 4, 6, symbole); if (res !== null) return res;
            return null;
        }

        function validerCoup(index, symbole, couleur) {
            grille[index] = symbole;
            const bouton = document.getElementById(`b${index}`);
            bouton.innerText = symbole;
            bouton.style.color = couleur;
        }

        function verifierCombos() {
            if(grille[0] !== "" && grille[0] === grille[1] && grille[0] === grille[2]) return true;
            if(grille[3] !== "" && grille[3] === grille[4] && grille[3] === grille[5]) return true;
            if(grille[6] !== "" && grille[6] === grille[7] && grille[6] === grille[8]) return true;
            if(grille[0] !== "" && grille[0] === grille[3] && grille[0] === grille[6]) return true;
            if(grille[1] !== "" && grille[1] === grille[4] && grille[1] === grille[7]) return true;
            if(grille[2] !== "" && grille[2] === grille[5] && grille[2] === grille[8]) return true;
            if(grille[0] !== "" && grille[0] === grille[4] && grille[0] === grille[8]) return true;
            if(grille[2] !== "" && grille[2] === grille[4] && grille[2] === grille[6]) return true;
            return false;
        }

        function verifierFinPartie() {
            if (verifierCombos()) {
                if (modeActuel === "solo") {
                    if (joueurActuel === "X") {
                        scoreHumain++;
                        document.getElementById("statut").innerText = "Victoire ! Tu as battu le robot ! 🎉";
                    } else {
                        scoreRobot++;
