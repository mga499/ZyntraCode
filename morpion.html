<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZyntraCode - Morpion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0a0a0a; 
            color: white; 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }
        h1 { 
            color: rgb(21, 213, 168); 
            font-size: 36px; 
            margin-bottom: 10px; 
            text-shadow: 0 0 10px rgba(21, 213, 168, 0.3);
        }
        #statut { font-size: 18px; margin-bottom: 20px; color: #aaa; }
        
        /* La Grille du Morpion */
        .grille { 
            display: grid; 
            grid-template-columns: repeat(3, 100px); 
            grid-template-rows: repeat(3, 100px); 
            gap: 10px; 
            background-color: #1a1a1a;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px rgba(21, 213, 168, 0.4);
        }
        
        /* Les Cases */
        .case { 
            background-color: #0a0a0a; 
            border: 2px solid #2a2a2a; 
            border-radius: 10px;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 40px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s;
        }
        .case:hover { 
            border-color: rgb(21, 213, 168); 
            background-color: #151515;
        }
        .case.X { color: rgb(21, 213, 168); text-shadow: 0 0 10px rgba(21, 213, 168, 0.5); }
        .case.O { color: #ff4a4a; text-shadow: 0 0 10px rgba(255, 74, 74, 0.5); }
        
        /* Bouton Rejouer / Retour */
        .btn {
            margin-top: 25px; 
            padding: 10px 25px; 
            background: rgb(21, 213, 168); 
            color: black; 
            border: none;
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            transition: 0.3s;
            text-decoration: none;
        }
        .btn:hover { 
            background: transparent; 
            color: rgb(21, 213, 168); 
            border: 2px solid rgb(21, 213, 168); 
        }
        .btn-retour {
            background: transparent;
            color: #aaa;
            border: 1px solid #2a2a2a;
            margin-left: 10px;
        }
        .btn-retour:hover {
            color: white;
            border-color: white;
        }
    </style>
</head>
<body>

    <h1>🎮 Morpion</h1>
    <div id="statut">C'est au tour du joueur X</div>

    <div class="grille">
        <div class="case" data-index="0"></div>
        <div class="case" data-index="1"></div>
        <div class="case" data-index="2"></div>
        <div class="case" data-index="3"></div>
        <div class="case" data-index="4"></div>
        <div class="case" data-index="5"></div>
        <div class="case" data-index="6"></div>
        <div class="case" data-index="7"></div>
        <div class="case" data-index="8"></div>
    </div>

    <div>
        <button class="btn" onclick="reinitialiser()">🔄 Rejouer</button>
        <a href="index.html" class="btn btn-retour">🏠 Boutique</a>
    </div>

    <!-- LOGIQUE DU JEU (JAVASCRIPT) -->
    <script>
        let joueurActuel = "X";
        let partieActive = true;
        let etatJeu = ["", "", "", "", "", "", "", "", ""];

        // Toutes les combinaisons de victoires (Lignes, Colonnes, Diagonales)
        const conditionsVictoire = [, [3, 4, 5], [6, 7, 8], // Les 3 Lignes horizontales, [1, 4, 7], [2, 5, 8], // Les 3 Colonnes verticales, [2, 4, 6]             // Les 2 Diagonales
        ];

        const cases = document.querySelectorAll('.case');
        const statut = document.getElementById('statut');

        cases.forEach(cellule => cellule.addEventListener('click', clicCase));

        function clicCase(evenement) {
            const caseCliquee = evenement.target;
            const indexClique = parseInt(caseCliquee.getAttribute('data-index'));

            if (etatJeu[indexClique] !== "" || !partieActive) return;

            etatJeu[indexClique] = joueurActuel;
            caseCliquee.innerHTML = joueurActuel;
            caseCliquee.classList.add(joueurActuel);

            verifierResultat();
        }

        function verifierResultat() {
            let victoire = false;

            for (let i = 0; i < conditionsVictoire.length; i++) {
                const condition = conditionsVictoire[i];
                let a = etatJeu[condition[0]];
                let b = etatJeu[condition[1]];
                let c = etatJeu[condition[2]];

                if (a === '' || b === '' || c === '') continue;
                if (a === b && b === c) {
                    victoire = true;
                    break;
                }
            }

            if (victoire) {
                statut.innerHTML = `🎉 Le joueur ${joueurActuel} a gagné !`;
                statut.style.color = joueurActuel === "X" ? "rgb(21, 213, 168)" : "#ff4a4a";
                partieActive = false;
                return;
            }

            if (!etatJeu.includes("")) {
                statut.innerHTML = "🤝 Match nul !";
                statut.style.color = "#aaa";
                partieActive = false;
                return;
            }

            joueurActuel = joueurActuel === "X" ? "O" : "X";
            statut.innerHTML = `C'est au tour du joueur ${joueurActuel}`;
        }

        function reinitialiser() {
            joueurActuel = "X";
            partieActive = true;
            etatJeu = ["", "", "", "", "", "", "", "", ""];
            statut.innerHTML = "C'est au tour du joueur X";
            statut.style.color = "#aaa";
            cases.forEach(cellule => {
                cellule.innerHTML = "";
                cellule.classList.remove("X", "O");
            });
        }
    </script>
</body>
</html>
