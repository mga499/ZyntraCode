<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpion Tactique | ZyntraCode</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Mono', monospace;
            text-align: center;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #00ffcc;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            letter-spacing: 2px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px rgba(0, 255, 204, 0.5); }
            50% { text-shadow: 0 0 30px rgba(0, 255, 204, 0.8); }
        }

        .subtitle {
            color: #b0b0b0;
            font-size: 0.85rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .menu-modes {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .btn-mode {
            padding: 12px 28px;
            font-size: 14px;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            border: 2px solid #00ffcc;
            background-color: transparent;
            color: #00ffcc;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }

        .btn-mode::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background-color: #00ffcc;
            z-index: -1;
            transition: left 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .btn-mode:hover {
            color: #0a0e27;
        }

        .btn-mode:hover::before {
            left: 0;
        }

        .btn-mode.actif {
            background-color: #00ffcc;
            color: #0a0e27;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
        }

        .btn-mode.actif::before {
            left: 0;
        }

        #statut {
            font-size: 1.3rem;
            margin-bottom: 30px;
            font-weight: 700;
            height: 40px;
            color: #00ffcc;
            letter-spacing: 1px;
            animation: pulse 0.6s ease-in-out;
        }

        @keyframes pulse {
            0% { opacity: 0.8; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        .grille {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(3, 90px);
            gap: 12px;
            justify-content: center;
            margin: 30px auto;
            padding: 20px;
            background: rgba(0, 255, 204, 0.05);
            border: 2px solid rgba(0, 255, 204, 0.2);
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .case {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid #00ffcc;
            font-size: 38px;
            font-weight: bold;
            font-family: 'Space Mono', monospace;
            color: #00ffcc;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }

        .case::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 255, 204, 0.2) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1;
        }

        .case:hover {
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4), inset 0 0 15px rgba(0, 255, 204, 0.1);
            transform: scale(1.05);
        }

        .case:hover::before {
            opacity: 1;
        }

        .case:active {
            transform: scale(0.95);
        }

        .case-x { color: #00ffcc !important; }
        .case-o { color: #ff1b8d !important; }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button#btn-recommencer {
            padding: 12px 32px;
            font-size: 14px;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            background-color: #00ffcc;
            color: #0a0e27;
            border: 2px solid #00ffcc;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        button#btn-recommencer:hover {
            background-color: transparent;
            color: #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
            transform: translateY(-2px);
        }

        button#btn-recommencer:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            .grille {
                grid-template-columns: repeat(3, 70px);
                grid-template-rows: repeat(3, 70px);
                gap: 10px;
                padding: 15px;
            }
            .case {
                width: 70px;
                height: 70px;
                font-size: 30px;
            }
            .menu-modes {
                flex-direction: column;
                gap: 10px;
            }
            .btn-mode {
                width: 100%;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>

    <h1>MORPION TACTIQUE</h1>
    <p class="subtitle">ZyntraCode</p>
    
    <div class="menu-modes">
        <button id="modeSolo" class="btn-mode actif" onclick="changerMode('solo')">Solo vs Robot</button>
        <button id="modeDuo" class="btn-mode" onclick="changerMode('duo')">Duo 2 Joueurs</button>
    </div>

    <div id="statut">À toi de jouer ! (Tu es les X)</div>

    <div class="grille">
        <button class="case" id="b0" onclick="jouerCase(0)"></button>
        <button class="case" id="b1" onclick="jouerCase(1)"></button>
        <button class="case" id="b2" onclick="jouerCase(2)"></button>
        <button class="case" id="b3" onclick="jouerCase(3)"></button>
        <button class="case" id="b4" onclick="jouerCase(4)"></button>
        <button class="case" id="b5" onclick="jouerCase(5)"></button>
        <button class="case" id="b6" onclick="jouerCase(6)"></button>
        <button class="case" id="b7" onclick="jouerCase(7)"></button>
        <button class="case" id="b8" onclick="jouerCase(8)"></button>
    </div>

    <div class="controls">
        <button id="btn-recommencer" onclick="recommencer()">Nouvelle Partie</button>
    </div>

    <script>
        let modeActuel = "solo";
        let joueurActuel = "X"; 
        let partieFinie = false;
        let grille = ["", "", "", "", "", "", "", "", ""]; 

        // Les 8 lignes gagnantes possibles (Horizontales, Verticales, Diagonales)
        const combosVictoire = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Lignes
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Colonnes
            [0, 4, 8], [2, 4, 6]             // Diagonales
        ];

        function changerMode(nouveauMode) {
            modeActuel = nouveauMode;
            document.getElementById("modeSolo").classList.remove("actif");
            document.getElementById("modeDuo").classList.remove("actif");
            if (modeActuel === "solo") document.getElementById("modeSolo").classList.add("actif");
            else document.getElementById("modeDuo").classList.add("actif");
            recommencer();
        }

        function jouerCase(index) {
            if (partieFinie || grille[index] !== "") return;
            if (modeActuel === "solo" && joueurActuel !== "X") return;

            if (joueurActuel === "X") {
                validerCoup(index, "X");
            } else {
                validerCoup(index, "O");
            }

            if (verifierFinPartie()) return;

            if (modeActuel === "duo") {
                joueurActuel = (joueurActuel === "X") ? "O" : "X";
                document.getElementById("statut").innerText = `Tour du joueur : ${joueurActuel}`;
            } 
            else if (modeActuel === "solo") {
                joueurActuel = "O";
                document.getElementById("statut").innerText = "Le robot réfléchit...";
                setTimeout(tourIA, 500); 
            }
        }

        function tourIA() {
            if (partieFinie || modeActuel !== "solo") return;

            // STRATÉGIE DE L'I.A. INTERACTIVE

            // ÉTAPE 1 : Est-ce que l'I.A. (O) peut gagner tout de suite ?
            let casePourGagner = trouverCaseCle("O");
            if (casePourGagner !== null) {
                validerCoup(casePourGagner, "O");
                verifierFinPartie();
                return;
            }

            // ÉTAPE 2 : Est-ce que le joueur (X) est sur le point de gagner ? SI OUI, ON BLOQUE !
            let caseABloquer = trouverCaseCle("X");
            if (caseABloquer !== null) {
                validerCoup(caseABloquer, "O");
                verifierFinPartie();
                joueurActuel = "X";
                document.getElementById("statut").innerText = "À toi de jouer ! (Tu es les X)";
                return;
            }

            // ÉTAPE 3 : Si rien à bloquer, prendre le centre (case 4) si disponible
            if (grille[4] === "") {
                validerCoup(4, "O");
                verifierFinPartie();
                joueurActuel = "X";
                document.getElementById("statut").innerText = "À toi de jouer !";
                return;
            }

            // ÉTAPE 4 : Sinon, prendre une case vide au hasard
            let casesVides = [];
            for (let i = 0; i < 9; i++) {
                if (grille[i] === "") casesVides.push(i);
            }

            if (casesVides.length > 0) {
                let indexAuHasard = Math.floor(Math.random() * casesVides.length);
                validerCoup(casesVides[indexAuHasard], "O");
                verifierFinPartie();
            }

            joueurActuel = "X";
            document.getElementById("statut").innerText = "À toi de jouer ! (Tu es les X)";
        }

        function trouverCaseCle(symbole) {
            for (let combo of combosVictoire) {
                const [a, b, c] = combo;
                
                let compteur = 0;
                if (grille[a] === symbole) compteur++;
                if (grille[b] === symbole) compteur++;
                if (grille[c] === symbole) compteur++;

                if (compteur === 2) {
                    if (grille[a] === "") return a;
                    if (grille[b] === "") return b;
                    if (grille[c] === "") return c;
                }
            }
            return null;
        }

        function validerCoup(index, symbole) {
            grille[index] = symbole;
            const bouton = document.getElementById(`b${index}`);
            bouton.innerText = symbole;
            bouton.classList.add(symbole === "X" ? "case-x" : "case-o");
        }

        function verifierFinPartie() {
            // Vérification victoire
            for (let combo of combosVictoire) {
                const [a, b, c] = combo;
                if (grille[a] !== "" && grille[a] === grille[b] && grille[a] === grille[c]) {
                    if (modeActuel === "solo") {
                        document.getElementById("statut").innerText = (joueurActuel === "X") ? "Victoire ! Tu as battu le robot ! 🎉" : "Dommage... Le robot a gagné ! 🤖";
                    } else {
                        document.getElementById("statut").innerText = `Le joueur ${joueurActuel} a GAGNÉ ! 🏆`;
                    }
                    partieFinie = true;
                    return true;
                }
            }

            // Vérification match nul
            if (!grille.includes("")) {
                document.getElementById("statut").innerText = "Match nul ! 🤝";
                partieFinie = true;
                return true;
            }
            return false;
        }

        function recommencer() {
            joueurActuel = "X";
            partieFinie = false;
            grille = ["", "", "", "", "", "", "", "", ""];
            document.getElementById("statut").innerText = (modeActuel === "solo") ? "À toi de jouer ! (Tu es les X)" : "Tour du joueur : X";
            for (let i = 0; i < 9; i++) {
                const btn = document.getElementById(`b${i}`);
                btn.innerText = "";
                btn.classList.remove("case-x", "case-o");
            }
        }
    </script>

</body>
</html>
