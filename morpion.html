<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpion Spatial - Difficulté Réglable</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            background-color: #1a1a1a;
            color: white;
            margin-top: 20px;
        }
        h1 { color: #00ffcc; margin-bottom: 5px; }
        .menu-options { margin-bottom: 15px; }
        
        .btn-mode {
            padding: 8px 15px;
            font-size: 15px;
            margin: 0 5px;
            border: 2px solid #555;
            background-color: #222;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-mode.actif {
            background-color: #00ffcc;
            color: black;
            border-color: #00ffcc;
        }

        /* Style de la sélection de difficulté */
        .select-difficulte {
            padding: 8px 12px;
            font-size: 15px;
            background-color: #333;
            color: white;
            border: 2px solid #555;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }
        .select-difficulte:focus { border-color: #00ffcc; }

        #statut {
            font-size: 24px;
            margin: 15px 0;
            font-weight: bold;
            height: 35px;
        }
        .grille {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .case {
            width: 100px;
            height: 100px;
            background-color: #333;
            border: 2px solid #555;
            font-size: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            border-radius: 10px;
            transition: background 0.3s;
        }
        .case:hover { background-color: #444; }
        
        button#btn-recommencer {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #ffffff;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button#btn-recommencer:hover { background-color: #dddddd; }
    </style>
</head>
<body>

    <h1>Morpion Tactique</h1>
    
    <div class="menu-options">
        <button id="modeSolo" class="btn-mode actif" onclick="changerMode('solo')">Mode Solo (vs Robot)</button>
        <button id="modeDuo" class="btn-mode" onclick="changerMode('duo')">Mode Duo (2 Joueurs)</button>
        
        <!-- Menu déroulant pour la difficulté -->
        <select id="difficulte" class="select-difficulte" onchange="recommencer()">
            <option value="facile">Difficulté : Facile 🟢</option>
            <option value="normal">Difficulté : Normal 🟡</option>
            <option value="difficile" selected>Difficulté : Difficile 🔴</option>
        </select>
    </div>

    <div id="statut">À toi de jouer ! (Tu es les X)</div>

    <div class="grille">
        <button class="case" id="b0" onclick="jouerCase(0)"></button>
        <button class="case" id="b1" onclick="jouerCase(1)"></button>
        <button class="case" id="b2" onclick="jouerCase(2)"></button>
        <button class="case" id="b3" onclick="jouerCase(3)"></button>
        <button class="case" id="b4" onclick="jouerCase(4)"></button>
        <button class="case" id="b5" onclick="jouerCase(5)"></button>
        <button class="case" id="b6" onclick="jouerCase(6)"></button>
        <button class="case" id="b7" onclick="jouerCase(7)"></button>
        <button class="case" id="b8" onclick="jouerCase(8)"></button>
    </div>

    <button id="btn-recommencer" onclick="recommencer()">Réinitialiser</button>

    <script>
        let modeActuel = "solo";
        let joueurActuel = "X"; 
        let partieFinie = false;
        let grille = ["", "", "", "", "", "", "", "", ""]; 

        const combosVictoire = [
           ,,, // Lignes
           ,,, // Colonnes
           ,             // Diagonales
        ];

        function changerMode(nouveauMode) {
            modeActuel = nouveauMode;
            document.getElementById("modeSolo").classList.remove("actif");
            document.getElementById("modeDuo").classList.remove("actif");
            
            const selectDiff = document.getElementById("difficulte");
            
            if (modeActuel === "solo") {
                document.getElementById("modeSolo").classList.add("actif");
                selectDiff.style.display = "inline-block"; // Affiche la difficulté
            } else {
                document.getElementById("modeDuo").classList.add("actif");
                selectDiff.style.display = "none"; // Cache la difficulté en Duo
            }
            recommencer();
        }

        function jouerCase(index) {
            if (partieFinie || grille[index] !== "") return;
            if (modeActuel === "solo" && joueurActuel !== "X") return;

            if (joueurActuel === "X") {
                validerCoup(index, "X", "#00ffcc");
            } else {
                validerCoup(index, "O", "#ff3366");
            }

            if (verifierFinPartie()) return;

            if (modeActuel === "duo") {
                joueurActuel = (joueurActuel === "X") ? "O" : "X";
                document.getElementById("statut").innerText = `Tour du joueur : ${joueurActuel}`;
            } 
            else if (modeActuel === "solo") {
                joueurActuel = "O";
                document.getElementById("statut").innerText = "Le robot réfléchit...";
                setTimeout(tourIA, 400); 
            }
        }

        function tourIA() {
            if (partieFinie || modeActuel !== "solo") return;

            // Récupérer le niveau choisi par l'utilisateur
            let niveau = document.getElementById("difficulte").value;
            let caseChoisie = null;

            // --- LOGIQUE MULTI-DIFFICULTÉ ---
            
            if (niveau === "difficile") {
                // Priorité 1 : Gagner tout de suite
                caseChoisie = trouverCaseCle("O");
                // Priorité 2 : Bloquer l'adversaire
                if (caseChoisie === null) caseChoisie = trouverCaseCle("X");
                // Priorité 3 : Prendre le centre stratégique (case 4)
                if (caseChoisie === null && grille[4] === "") caseChoisie = 4;
            } 
            else if (niveau === "normal") {
                // Le mode normal essaie uniquement de bloquer les coups du joueur
                caseChoisie = trouverCaseCle("X");
            }
            // (Si niveau est "facile", caseChoisie reste null et passe directement au hasard)

            // Si aucune case tactique n'a été trouvée, on prend une case vide au hasard
            if (caseChoisie === null) {
                let casesVides = [];
                for (let i = 0; i < 9; i++) {
                    if (grille[i] === "") casesVides.push(i);
                }
                if (casesVides.length > 0) {
                    let indexAuHasard = Math.floor(Math.random() * casesVides.length);
                    caseChoisie = casesVides[indexAuHasard];
                }
            }

            // Validation du coup du robot
            if (caseChoisie !== null) {
                validerCoup(caseChoisie, "O", "#ff3366");
                verifierFinPartie();
            }

            joueurActuel = "X";
            document.getElementById("statut").innerText = "À toi de jouer ! (Tu es les X)";
        }

        function trouverCaseCle(symbole) {
            for (let combo of combosVictoire) {
                const [a, b, c] = combo;
                let compteur = 0;
                if (grille[a] === symbole) compteur++;
                if (grille[b] === symbole) compteur++;
                if (grille[c] === symbole) compteur++;

                if (compteur === 2) {
                    if (grille[a] === "") return a;
                    if (grille[b] === "") return b;
                    if (grille[c] === "") return c;
                }
            }
            return null;
        }

        function validerCoup(index, symbole, couleur) {
            grille[index] = symbole;
            const bouton = document.getElementById(`b${index}`);
            bouton.innerText = symbole;
            bouton.style.color = couleur;
        }

        function verifierFinPartie() {
            for (let combo of combosVictoire) {
                const [a, b, c] = combo;
                if (grille[a] !== "" && grille[a] === grille[b] && grille[a] === grille[c]) {
                    if (modeActuel === "solo") {
                        document.getElementById("statut").innerText = (joueurActuel === "X") ? "Victoire ! Tu as battu le robot ! 🎉" : "Dommage... Le robot a gagné ! 🤖";
                    } else {
                        document.getElementById("statut").innerText = `Le joueur ${joueurActuel} a GAGNÉ ! 🏆`;
                    }
                    partieFinie = true;
                    return true;
                }
            }

            if (!grille.includes("")) {
                document.getElementById("statut").innerText = "Match nul ! 🤝";
                partieFinie = true;
                return true;
            }
            return false;
        }

        function recommencer() {
            joueurActuel = "X";
            partieFinie = false;
            grille = ["", "", "", "", "", "", "", "", ""];
            document.getElementById("statut").innerText = (modeActuel === "solo") ? "À toi de jouer ! (Tu es les X)" : "Tour du joueur : X";
