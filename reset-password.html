<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZyntraCode - Nouveau mot de passe</title>
    <link rel="icon" type="image/png" href="logo_zyntracode2.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a0a0a; color: white;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
        }
        .card {
            background: #1a1a1a; border: 1px solid #2a2a2a;
            border-radius: 15px; padding: 40px;
            width: 100%; max-width: 420px; margin: 20px;
        }
        .card h2 { color: rgb(21,213,168); font-size: 24px; margin-bottom: 8px; text-align: center; }
        .sous-titre { color: #aaa; font-size: 14px; text-align: center; margin-bottom: 25px; }
        .champ { margin-bottom: 18px; }
        .champ label { display: block; color: #aaa; font-size: 13px; margin-bottom: 6px; }
        .champ input {
            width: 100%; padding: 12px 15px;
            background: #0a0a0a; border: 2px solid #2a2a2a;
            border-radius: 10px; color: white;
            font-size: 14px; outline: none; transition: 0.2s;
        }
        .champ input:focus { border-color: rgb(21,213,168); }
        .force-barre { display: flex; gap: 4px; margin-top: 8px; }
        .force-barre div { flex: 1; height: 4px; background: #2a2a2a; border-radius: 2px; transition: background 0.3s; }
        .btn {
            width: 100%; padding: 13px;
            background: rgb(21,213,168); color: black;
            border: 2px solid rgb(21,213,168); border-radius: 10px;
            font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { background: transparent; color: rgb(21,213,168); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg { padding: 10px 15px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; display: none; text-align: center; }
        .msg.erreur { background: rgba(255,77,77,0.1); border: 1px solid #ff4d4d; color: #ff4d4d; }
        .msg.succes { background: rgba(21,213,168,0.1); border: 1px solid rgb(21,213,168); color: rgb(21,213,168); }
    </style>
</head>
<body>

<div class="card">
    <h2>🔒 Nouveau mot de passe</h2>
    <p class="sous-titre">Entre ton nouveau mot de passe</p>

    <div class="msg erreur" id="msg-err"></div>
    <div class="msg succes" id="msg-ok"></div>

    <div class="champ">
        <label>Nouveau mot de passe</label>
        <input type="password" id="pwd1" placeholder="••••••••" oninput="verifierForce(this.value)">
        <div class="force-barre">
            <div id="b1"></div><div id="b2"></div><div id="b3"></div><div id="b4"></div>
        </div>
    </div>
    <div class="champ">
        <label>Confirmer le mot de passe</label>
        <input type="password" id="pwd2" placeholder="••••••••">
    </div>

    <button class="btn" id="btn" onclick="changerMotDePasse()">Changer le mot de passe</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const { createClient } = supabase;
    const supabaseClient = createClient(
        'https://nvvpvwqcjqujyzvdimix.supabase.co',
        'sb_publishable_7oQ8rUh7OCE0Uo-DUwSUcw_CKOPnCU4'
    );

    function verifierForce(val) {
        const couleurs = ["#ff4d4d", "#ffaa00", "rgb(21,213,168)", "rgb(21,213,168)"];
        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 10) score++;
        if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        for (let i = 1; i <= 4; i++) {
            document.getElementById("b" + i).style.background = i <= score ? couleurs[score - 1] : "#2a2a2a";
        }
    }

    async function changerMotDePasse() {
        const p1 = document.getElementById('pwd1').value;
        const p2 = document.getElementById('pwd2').value;

        if (!p1) return affErr('Entre un nouveau mot de passe.');
        if (p1 !== p2) return affErr('Les mots de passe ne correspondent pas.');
        if (p1.length < 6) return affErr('Minimum 6 caractères.');

        const btn = document.getElementById('btn');
        btn.disabled = true;
        btn.textContent = 'Changement...';

        const { error } = await supabaseClient.auth.updateUser({ password: p1 });

        if (error) {
            affErr('Erreur : ' + error.message);
            btn.disabled = false;
            btn.textContent = 'Changer le mot de passe';
        } else {
            document.getElementById('msg-ok').textContent = 'Mot de passe changé ✓ Redirection...';
            document.getElementById('msg-ok').style.display = 'block';
            setTimeout(() => window.location.href = 'index.html', 2000);
        }
    }

    function affErr(msg) {
        document.getElementById('msg-err').textContent = msg;
        document.getElementById('msg-err').style.display = 'block';
        document.getElementById('msg-ok').style.display = 'none';
    }
</script>

</body>
</html>
