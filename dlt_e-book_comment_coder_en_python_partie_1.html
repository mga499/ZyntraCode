<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZyntraCode - Paramètres</title>
<link rel="icon" type="image/png" href="logo zyntracode v3.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;
  --panel:#101213;
  --panel-2:#15181a;
  --border:#222625;
  --accent:#15d5a8;
  --accent-rgb:21,213,168;
  --purple:#c586c0;
  --red:#ff4d4d;
  --text:#e9e9e9;
  --text-dim:#8a9290;
  --sans:'Inter',Arial,sans-serif;
  --display:'Space Grotesk',var(--sans);
  --mono:'JetBrains Mono',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden;position:relative;
  min-height:100vh;padding:50px 24px 50px 234px;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px;}

/* ---------- ambiance de fond ---------- */
.bg-grid{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:42px 42px;mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,black 40%,transparent 90%);}
.bg-glow{position:fixed;inset:0;z-index:-3;pointer-events:none;overflow:hidden;}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.18;animation:float 16s ease-in-out infinite;}
.blob-1{width:480px;height:480px;background:var(--accent);top:-120px;left:10%;}
.blob-2{width:380px;height:380px;background:var(--purple);bottom:-140px;right:5%;animation-delay:-8s;}
@keyframes float{0%,100%{transform:translate(0,0);}50%{transform:translate(40px,-50px);}}
@keyframes blink{50%{opacity:0;}}

/* ---------- sidebar / nav ---------- */
#menu-btn{
  position:fixed;top:14px;left:14px;z-index:1001;display:none;
  background:var(--panel);border:1px solid var(--border);color:var(--accent);
  font-family:var(--mono);font-size:14px;padding:9px 14px;border-radius:6px;cursor:pointer;transition:.2s;
}
#menu-btn:hover{border-color:var(--accent);box-shadow:0 0 14px rgba(var(--accent-rgb),.25);}
#menu{
  background:var(--panel);width:210px;height:100vh;position:fixed;top:0;left:0;z-index:1000;
  border-right:1px solid var(--border);padding:26px 14px 14px 14px;transition:.3s;display:flex;flex-direction:column;
}
.brand{font-family:var(--mono);font-weight:600;color:var(--text);font-size:15px;padding:0 10px 22px 10px;border-bottom:1px solid var(--border);margin-bottom:14px;letter-spacing:.3px;text-align:left;}
.brand span{color:var(--accent);}
.cursor-blink{display:inline-block;width:8px;background:var(--accent);margin-left:2px;animation:blink 1s steps(1) infinite;}
.nav-label{font-family:var(--mono);font-size:11px;color:var(--text-dim);padding:4px 10px 8px;letter-spacing:.5px;text-align:left;}
#menu a{
  color:#c7cccb;display:flex;align-items:center;gap:8px;padding:10px 10px;margin-bottom:2px;
  text-decoration:none;border-radius:6px;font-size:14px;transition:.18s;border-left:2px solid transparent;text-align:left;
}
#menu a:hover{color:var(--accent);background:var(--panel-2);border-left-color:var(--accent);padding-left:13px;}
.menu-jeux-wrapper{position:relative;}
.menu-jeux-titre{
  color:#c7cccb;display:flex;align-items:center;gap:8px;padding:10px 10px;text-decoration:none;
  border-radius:6px;cursor:pointer;user-select:none;font-size:14px;transition:.18s;border-left:2px solid transparent;text-align:left;
}
.menu-jeux-titre:hover{color:var(--accent);background:var(--panel-2);border-left-color:var(--accent);}
.menu-jeux-dropdown{max-height:0;overflow:hidden;transition:max-height .3s ease;background:#0c0e0d;border-radius:6px;}
.menu-jeux-wrapper:hover .menu-jeux-dropdown{max-height:200px;}
.menu-jeux-dropdown a{
  color:#8a9290!important;padding:9px 10px 9px 26px!important;font-size:12.5px!important;
  font-family:var(--mono);border-left:2px solid var(--border);margin:2px 0;border-radius:0!important;text-align:left;
}
.menu-jeux-dropdown a:hover{color:var(--accent)!important;background:var(--panel-2)!important;border-left-color:var(--accent);}

/* ---------- en-tête ---------- */
.page-head{max-width:560px;margin-bottom:28px;}
.eyebrow{
  font-family:var(--mono);color:var(--accent);font-size:13px;display:inline-flex;align-items:center;gap:8px;
  margin-bottom:10px;letter-spacing:.3px;
}
.eyebrow::before{content:'';width:6px;height:6px;background:var(--accent);border-radius:50%;box-shadow:0 0 8px rgba(var(--accent-rgb),.8);}
h1{font-family:var(--display);font-weight:700;font-size:32px;
  background:linear-gradient(135deg,#fff 30%,var(--accent) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}

/* ---------- reveal ---------- */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .55s ease,transform .55s ease;}
.reveal.in-view{opacity:1;transform:none;}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none;}
  .blob,.cursor-blink{animation:none;}
}

/* ---------- panneaux de section ---------- */
.section{
  background:var(--panel);border:1px solid var(--border);border-radius:10px;max-width:520px;margin-bottom:20px;
  overflow:hidden;box-shadow:0 24px 48px -28px rgba(0,0,0,.55);transition:.25s;
}
.section:hover{border-color:rgba(var(--accent-rgb),.4);}
.section-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--panel-2);border-bottom:1px solid var(--border);}
.section-bar .dot{width:9px;height:9px;border-radius:50%;}
.section-bar span{font-family:var(--mono);font-size:12px;color:var(--text-dim);}
.section-body{padding:24px 24px 26px;}
.champ{margin-bottom:18px;}
.champ label{display:flex;align-items:center;gap:6px;color:var(--text);font-size:13px;margin-bottom:8px;font-family:var(--mono);}
.champ label::before{content:'//';color:var(--accent);}
.champ input{
  width:100%;padding:11px 14px;background:#0c0e0d;border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:14px;font-family:var(--sans);outline:none;transition:.2s;
}
.champ input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.12);}
.champ input:disabled{opacity:.45;cursor:not-allowed;}
#email-affichage{
  font-family:var(--mono);font-size:18px;font-weight:600;color:var(--text);background:#0c0e0d;
  border:1px solid var(--border);border-radius:8px;padding:11px 14px;letter-spacing:1.5px;
}
.section-body p{color:var(--text-dim);font-size:13.5px;margin-bottom:16px;line-height:1.5;}

.btn{
  padding:11px 24px;background:var(--accent);color:#06140f;border:1px solid var(--accent);
  border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:.22s;font-family:var(--sans);
}
.btn:hover{background:transparent;color:var(--accent);box-shadow:0 0 18px rgba(var(--accent-rgb),.3);}
.btn:disabled{opacity:.6;cursor:not-allowed;box-shadow:none;}
.btn-danger{
  padding:11px 24px;background:transparent;color:var(--red);border:1px solid var(--red);
  border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:.22s;font-family:var(--sans);
}
.btn-danger:hover{background:rgba(255,77,77,.1);}

.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:15px;display:none;font-family:var(--mono);}
.msg.erreur{background:rgba(255,77,77,.1);border:1px solid var(--red);color:#ff7a7a;}
.msg.succes{background:rgba(var(--accent-rgb),.1);border:1px solid var(--accent);color:var(--accent);}

.force-barre{display:flex;gap:4px;margin-top:8px;}
.force-barre div{flex:1;height:4px;background:var(--border);border-radius:2px;transition:background .3s;}

/* ---------- mobile ---------- */
@media (max-width:768px){
  #menu-btn{display:block;}
  #menu{display:none;}
  #menu.visible{display:flex;}
  body{padding:84px 16px 40px;}
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>

<button id="menu-btn">[ menu ]</button>

<nav id="menu">
  <div class="brand">Zyntra<span>Code</span><span class="cursor-blink"></span></div>
  <div class="nav-label">// navigation</div>
  <a href="index.html">Accueil</a>
  <a href="2-script.html">Script</a>
  <a href="3-contact.html">Contact</a>
  <a href="10-e-book.html">E-book</a>

  <div class="menu-jeux-wrapper">
    <span class="menu-jeux-titre">🎮 Jeux ▾</span>
    <div class="menu-jeux-dropdown">
      <a href="morpion.html">⭕ Morpion</a>
      <a href="clash_arena.html">🕌 Zyntra Arena</a>
    </div>
  </div>
</nav>

<div class="page-head reveal">
  <div class="eyebrow">$ cat ./config/utilisateur</div>
  <h1>Paramètres</h1>
</div>

<!-- PROFIL -->
<div class="section reveal">
  <div class="section-bar"><span class="dot" style="background:var(--accent)"></span><span>profil.json</span></div>
  <div class="section-body">
    <div class="msg erreur" id="msg-profil-err"></div>
    <div class="msg succes" id="msg-profil-ok"></div>
    <div class="champ">
      <label>nom_utilisateur</label>
      <input type="text" id="username" placeholder="MonPseudo">
    </div>
    <div class="champ">
      <label>email (non modifiable)</label>
      <div id="email-affichage">—</div>
    </div>
    <button class="btn" onclick="sauvegarderProfil()">Sauvegarder</button>
  </div>
</div>

<!-- MOT DE PASSE -->
<div class="section reveal">
  <div class="section-bar"><span class="dot" style="background:#ffbd2e"></span><span>securite.json</span></div>
  <div class="section-body">
    <div class="msg erreur" id="msg-pwd-err"></div>
    <div class="msg succes" id="msg-pwd-ok"></div>
    <p>Un email de réinitialisation sera envoyé à ton adresse email.</p>
    <button class="btn" onclick="envoyerReset()">Envoyer un email de réinitialisation</button>
  </div>
</div>

<!-- SUPPRIMER COMPTE -->
<div class="section reveal">
  <div class="section-bar"><span class="dot" style="background:var(--red)"></span><span>zone-dangereuse.json</span></div>
  <div class="section-body">
    <p>La suppression de ton compte est irréversible.</p>
    <button class="btn-danger" onclick="supprimerCompte()">Supprimer mon compte</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="profil-menu.js"></script>
<script>
    const btnMenu = document.getElementById("menu-btn");
    const menu = document.getElementById("menu");
    btnMenu.addEventListener("click", () => menu.classList.toggle("visible"));

    function affMsg(idOk, idErr, msg, type) {
        const ok = document.getElementById(idOk);
        const err = document.getElementById(idErr);
        if (type === 'succes') { ok.textContent = msg; ok.style.display = 'block'; err.style.display = 'none'; }
        else { err.textContent = msg; err.style.display = 'block'; ok.style.display = 'none'; }
        setTimeout(() => { ok.style.display = 'none'; err.style.display = 'none'; }, 4000);
    }

    function verifierForce(val) {
        const couleurs = ["#ff4d4d", "#ffaa00", "rgb(21,213,168)", "rgb(21,213,168)"];
        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 10) score++;
        if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        for (let i = 1; i <= 4; i++) {
            document.getElementById("b" + i).style.background = i <= score ? couleurs[score - 1] : "#2a2a2a";
        }
    }

    async function chargerProfil() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) { window.location.href = 'login.html'; return; }
        document.getElementById('username').value = user.user_metadata?.username || '';
        // Masquer l'email : garder 1er caractère + *** + @domaine
        const email = user.email;
        const atIndex = email.indexOf('@');
        const premierChar = email[0];
        const etoiles = '●'.repeat(atIndex - 1);
        const domaine = email.slice(atIndex);
        document.getElementById('email-affichage').textContent = premierChar + etoiles + domaine;
    }

    async function sauvegarderProfil() {
        const username = document.getElementById('username').value.trim();
        if (!username) return affMsg('msg-profil-ok', 'msg-profil-err', 'Entre un nom d\'utilisateur.', 'erreur');
        const { error } = await supabaseClient.auth.updateUser({ data: { username } });
        if (error) affMsg('msg-profil-ok', 'msg-profil-err', 'Erreur : ' + error.message, 'erreur');
        else affMsg('msg-profil-ok', 'msg-profil-err', 'Profil mis à jour ✓', 'succes');
    }

    async function envoyerReset() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) return;

        const { error } = await supabaseClient.auth.resetPasswordForEmail(user.email, {
            redirectTo: 'https://zyntracode.ch/reset-password.html'
        });

        if (error) affMsg('msg-pwd-ok', 'msg-pwd-err', 'Erreur : ' + error.message, 'erreur');
        else affMsg('msg-pwd-ok', 'msg-pwd-err', 'Email envoyé ! Vérifie ta boîte mail. ✓', 'succes');
    }

    async function supprimerCompte() {
        if (!confirm('Es-tu sûr de vouloir supprimer ton compte ? Cette action est irréversible.')) return;
        alert('Pour supprimer ton compte, contacte-nous via la page Contact.');
    }

    chargerProfil();

    /* ---------- reveal au scroll ---------- */
    const revealEls = document.querySelectorAll('.reveal');
    revealEls.forEach((el) => {
        const siblings = document.querySelectorAll('.reveal');
        const idx = Array.prototype.indexOf.call(siblings, el);
        el.style.transitionDelay = (idx * 0.08) + 's';
    });
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('in-view');
                observer.unobserve(entry.target);
            }
        });
    }, {threshold: 0.12});
    revealEls.forEach(el => observer.observe(el));
</script>

<script src="mise-a-jour.js"></script>

</body>
