<script>
    const EMAILJS_SERVICE_ID  = "service_daaxxvg";
    const EMAILJS_TEMPLATE_ID = "template_bb5opqq";
    const EMAILJS_PUBLIC_KEY  = "CIEjPItwnunl99qyE";

    function ouvrirModal() {
        document.getElementById("modal-overlay").classList.add("visible");
        document.getElementById("msg-erreur").style.display = "none";
        document.getElementById("msg-succes").style.display = "none";
    }

    function fermerModal() {
        document.getElementById("modal-overlay").classList.remove("visible");
    }

    function payer() {
        const email = document.getElementById("email-paiement").value.trim();
        if (!email) {
            document.getElementById("msg-erreur").textContent = "Entre ton adresse email.";
            document.getElementById("msg-erreur").style.display = "block";
            return;
        }
        localStorage.setItem("email_achat", email);
        window.location.href = "https://zyntracode.payrexx.com/fr/?payment=0da409063cd786a19f2325f47f9feb71";
    }

    async function verifierRetour() {
        const params = new URLSearchParams(window.location.search);
        if (params.get("succes") === "1") {
            const email = localStorage.getItem("email_achat");
            if (email) {
                await envoyerBotParEmail(email);
                localStorage.removeItem("email_achat");
            }
            window.history.replaceState({}, "", "/dtl_moderion.html");
        }
        if (params.get("erreur") === "1") {
            alert("Le paiement a échoué. Réessaie.");
            window.history.replaceState({}, "", "/dtl_moderion.html");
        }
    }

    async function envoyerBotParEmail(email) {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js";
        document.head.appendChild(script);
        script.onload = async () => {
            emailjs.init(EMAILJS_PUBLIC_KEY);
            try {
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                    to_email: email,
                    produit: "Générateur de mot de passe",
                    lien_bot: "Lien de téléchargement envoyé séparément"
                });
                alert("✅ Paiement réussi ! Vérifie ton email pour recevoir le script.");
            } catch(err) {
                alert("Paiement reçu mais erreur email. Contacte-nous.");
            }
        };
    }

    verifierRetour();
</script>
