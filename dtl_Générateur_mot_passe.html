<head>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;
  --panel:#101213;
  --panel-2:#15181a;
  --border:#222625;
  --accent:#15d5a8;
  --accent-rgb:21,213,168;
  --purple:#c586c0;
  --text:#e9e9e9;
  --text-dim:#8a9290;
  --sans:'Inter',Arial,sans-serif;
  --display:'Space Grotesk',var(--sans);
  --mono:'JetBrains Mono',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);text-align:center;overflow-x:hidden;position:relative;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px;}

/* ---------- ambiance de fond ---------- */
.bg-grid{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:42px 42px;mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,black 40%,transparent 90%);}
.bg-glow{position:fixed;inset:0;z-index:-3;pointer-events:none;overflow:hidden;}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.18;animation:float 16s ease-in-out infinite;}
.blob-1{width:480px;height:480px;background:var(--accent);top:-120px;left:10%;}
.blob-2{width:380px;height:380px;background:var(--purple);bottom:-140px;right:5%;animation-delay:-8s;}
@keyframes float{0%,100%{transform:translate(0,0);}50%{transform:translate(40px,-50px);}}

/* ---------- bouton retour ---------- */
#retoure{
  position:fixed;top:15px;left:15px;padding:9px 16px;background:var(--panel);
  border:1px solid var(--border);color:var(--accent);border-radius:8px;text-decoration:none;
  font-family:var(--mono);font-size:14px;z-index:1001;transition:.22s;
}
#retoure:hover{border-color:var(--accent);box-shadow:0 0 14px rgba(var(--accent-rgb),.25);}

@media (max-width:768px){
  #retoure{padding:6px 12px;font-size:12px;max-width:80px;}
  #profil-btn{top:15px!important;right:15px!important;max-width:120px!important;}
  #profil-nom{max-width:60px!important;font-size:11px!important;}
  #profil-avatar{width:22px!important;height:22px!important;font-size:11px!important;}
}

/* ---------- reveal ---------- */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s ease;}
.reveal.in-view{opacity:1;transform:none;}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none;}
  .blob{animation:none;}
}

/* ---------- hero / panneau produit ---------- */
.hero{padding:100px 20px 60px;display:flex;justify-content:center;}
.product-panel{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;
  max-width:480px;width:100%;box-shadow:0 30px 60px -30px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.02);position:relative;
}
.product-panel::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0px,rgba(255,255,255,.012) 1px,transparent 1px,transparent 3px);}
.term-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel-2);border-bottom:1px solid var(--border);}
.dot{width:10px;height:10px;border-radius:50%;}
.dot.r{background:#ff5f56;}.dot.y{background:#ffbd2e;}.dot.g{background:#27c93f;}
.term-tab{margin-left:10px;font-family:var(--mono);font-size:12px;color:var(--text-dim);}
.product-body{padding:34px 28px 36px;}
#img_moderion{width:110px;border-radius:50%;border:3px solid var(--border);margin-bottom:22px;transition:.3s;}
#img_moderion:hover{border-color:var(--accent);box-shadow:0 0 25px rgba(var(--accent-rgb),.3);}
#txt_moderion{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,38px);
  background:linear-gradient(135deg,#fff 30%,var(--accent) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px;}
#in_moderion{color:var(--text-dim);font-size:15px;font-weight:400;max-width:380px;margin:0 auto 18px auto;line-height:1.5;}
#gtt_moderion{display:inline-block;background:var(--accent);color:#06140f;padding:6px 20px;border-radius:20px;font-size:14px;font-family:var(--mono);font-weight:700;margin-bottom:30px;}
.btn-ajouter{
  display:inline-block;padding:13px 30px;background:var(--accent);color:#06140f;border:1px solid var(--accent);
  border-radius:8px;text-decoration:none;font-weight:700;font-size:15px;transition:.22s;font-family:var(--sans);
}
.btn-ajouter:hover{background:transparent;color:var(--accent);box-shadow:0 0 22px rgba(var(--accent-rgb),.3);transform:translateY(-2px);}

/* ---------- footer ---------- */
.footer-bar{font-family:var(--mono);font-size:12px;color:var(--text-dim);padding:22px 24px;border-top:1px solid var(--border);margin-top:10px;text-align:center;}
.footer-bar a{color:var(--accent);text-decoration:none;}
.footer-bar a:hover{text-decoration:underline;}

/* ---------- modal (réservé pour une future intégration du paiement) ---------- */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:5000;align-items:center;justify-content:center;}
#modal-overlay.visible{display:flex;}
#modal{background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:30px;width:90%;max-width:400px;animation:popIn .3s ease;text-align:left;}
@keyframes popIn{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
#modal h2{color:var(--accent);font-family:var(--display);font-size:20px;margin-bottom:4px;}
#modal .modal-sous{color:var(--text-dim);font-size:13px;margin-bottom:22px;}
#modal .champ{margin-bottom:16px;}
#modal label{display:block;color:var(--text-dim);font-size:13px;margin-bottom:6px;font-family:var(--mono);}
#modal input{width:100%;padding:11px 14px;background:#0c0e0d;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:.2s;}
#modal input:focus{border-color:var(--accent);}
.modal-btns{display:flex;gap:10px;margin-top:6px;}
.btn-payer{flex:1;padding:12px;background:var(--accent);color:#06140f;border:1px solid var(--accent);border-radius:8px;font-size:14.5px;font-weight:700;cursor:pointer;transition:.2s;}
.btn-payer:hover{background:transparent;color:var(--accent);}
.btn-payer:disabled{opacity:.6;cursor:not-allowed;}
.btn-annuler{padding:12px 16px;background:transparent;color:var(--text-dim);border:1px solid var(--border);border-radius:8px;font-size:13.5px;cursor:pointer;transition:.2s;}
.btn-annuler:hover{border-color:var(--text-dim);color:var(--text);}
.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none;}
.msg.erreur{background:rgba(255,77,77,.1);border:1px solid #ff4d4d;color:#ff7a7a;}
.msg.succes{background:rgba(var(--accent-rgb),.1);border:1px solid var(--accent);color:var(--accent);}
</style>
</head>
<body>

      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>

      <img id="img_moderion" src="icone_générateur_motde_passe.png" alt="logo_générateur de mot de passe">
      <h1 id="txt_moderion">Générateur de mot de passe</h1>
      <h4 id="in_moderion">Il génère des mots de passe très forts, incassables par force brute !</h4>
      <h5 id="gtt_moderion">0,95 CHF</h5>
      <br><br>
      <a href="3-contact.html" class="btn-ajouter" id="btn-obtenir" target="_blank">Obtenir le Script</a>
    </div>
  </div>
</div>

<div class="footer-bar">
  © 2026 ZyntraCode — Tous droits réservés |
  <a href="3-contact.html">Contact</a> |
  <a href="conditions.html">Conditions d'utilisation</a> |
  <a href="politique-confidentialite.html">Politique de confidentialité</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="profil-menu.js"></script>
<script>
    const EMAILJS_SERVICE_ID  = "service_daaxxvg";
    const EMAILJS_TEMPLATE_ID = "template_bb5opqq";
    const EMAILJS_PUBLIC_KEY  = "CIEjPItwnunl99qyE";

    function ouvrirModal() {
        document.getElementById("modal-overlay").classList.add("visible");
        document.getElementById("msg-erreur").style.display = "none";
        document.getElementById("msg-succes").style.display = "none";
    }

    function fermerModal() {
        document.getElementById("modal-overlay").classList.remove("visible");
    }

    function payer() {
        const email = document.getElementById("email-paiement").value.trim();
        if (!email) {
            document.getElementById("msg-erreur").textContent = "Entre ton adresse email.";
            document.getElementById("msg-erreur").style.display = "block";
            return;
        }
        localStorage.setItem("email_achat", email);
        window.location.href = "https://zyntracode.payrexx.com/fr/?payment=0da409063cd786a19f2325f47f9feb71";
    }

    async function verifierRetour() {
        const params = new URLSearchParams(window.location.search);
        if (params.get("succes") === "1") {
            const email = localStorage.getItem("email_achat");
            if (email) {
                await envoyerBotParEmail(email);
                localStorage.removeItem("email_achat");
            }
            window.history.replaceState({}, "", "/dtl_moderion.html");
        }
        if (params.get("erreur") === "1") {
            alert("Le paiement a échoué. Réessaie.");
            window.history.replaceState({}, "", "/dtl_moderion.html");
        }
    }

    async function envoyerBotParEmail(email) {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js";
        document.head.appendChild(script);
        script.onload = async () => {
            emailjs.init(EMAILJS_PUBLIC_KEY);
            try {
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                    to_email: email,
                    produit: "Générateur de mot de passe",
                    lien_bot: "Lien de téléchargement envoyé séparément"
                });
                alert("✅ Paiement réussi ! Vérifie ton email pour recevoir le script.");
            } catch(err) {
                alert("Paiement reçu mais erreur email. Contacte-nous.");
            }
        };
    }

    verifierRetour();

    /* ---------- reveal au scroll ---------- */
    const revealEls = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('in-view');
                observer.unobserve(entry.target);
            }
        });
    }, {threshold: 0.15});
    revealEls.forEach(el => observer.observe(el));
</script>
