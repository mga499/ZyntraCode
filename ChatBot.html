<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Chatbot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: #1a1a1a; border: 1px solid rgb(21, 213, 168); border-radius: 20px; padding: 50px; text-align: center; max-width: 400px; }
        h1 { color: rgb(21, 213, 168); font-size: 32px; margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 30px; }
        .btn-login { display: inline-block; padding: 14px 30px; background: #5865F2; color: white; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .btn-login:hover { opacity: 0.8; }
    </style>
</head>
<body>

<body>

<div class="chat-section">

    <h2>🧠 Chat IA</h2>

    <div class="chat-box" id="chat-box">
        <div class="msg-ia">
            <span>
                Bonjour 👋 Je suis l'IA de ZyntraCode 😊
            </span>
        </div>
    </div>

    <div class="chat-input">
        <input
            type="text"
            id="chat-input"
            placeholder="Pose ta question..."
            onkeypress="if(event.key==='Enter') envoyerMessage()"
        >

        <button onclick="envoyerMessage()">
            Envoyer
        </button>
    </div>

</div>

<script>

const CONNAISSANCES = {

    salutation: {
        mots: ["bonjour", "salut", "hello", "bonsoir", "hey"],
        reponses: [
            "Bonjour 👋",
            "Salut 😊",
            "Hello 😄"
        ]
    },

    identite: {
        mots: ["qui es tu", "c'est quoi", "tu es quoi"],
        reponses: [
            "Je suis l'IA de ZyntraCode 🤖"
        ]
    },

    bot: {
        mots: ["bot", "moderion", "discord"],
        reponses: [
            "Modérion est notre bot Discord gratuit 🚀"
        ]
    },

    prix: {
        mots: ["prix", "gratuit", "payant"],
        reponses: [
            "Modérion est 100% gratuit 🎉"
        ]
    },

    contact: {
        mots: ["contact", "email", "support"],
        reponses: [
            "Tu peux nous contacter sur zyntracode.ch 📩"
        ]
    }

};

function repondreIA(message){

    message = message.toLowerCase();

    for(const categorie in CONNAISSANCES){

        const data = CONNAISSANCES[categorie];

        for(const mot of data.mots){

            if(message.includes(mot)){

                return data.reponses[
                    Math.floor(Math.random() * data.reponses.length)
                ];
            }
        }
    }

    return "Je ne comprends pas 🤔";
}

function envoyerMessage(){

    const input = document.getElementById("chat-input");

    const chatBox = document.getElementById("chat-box");

    const message = input.value.trim();

    if(!message) return;

    chatBox.innerHTML += `
        <div class="msg-user">
            <span>${message}</span>
        </div>
    `;

    const reponse = repondreIA(message);

    chatBox.innerHTML += `
        <div class="msg-ia">
            <span>${reponse}</span>
        </div>
    `;

    input.value = "";

    chatBox.scrollTop = chatBox.scrollHeight;
}

</script>

</body>
</html>
    
</body>
</html>
