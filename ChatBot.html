<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot IA v4 ULTIME | ZyntraCode</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #00ffcc;
            --secondary: #ff1b8d;
            --bg-dark: #0a0e27;
            --bg-card: #1a1a2e;
            --text: #ffffff;
        }

        body.theme-disco {
            --primary: #ff1b8d;
            --secondary: #00ffcc;
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a2e 100%);
            color: var(--text);
            font-family: 'Space Mono', monospace;
            height: 100vh;
            display: flex;
            padding: 10px;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            gap: 10px;
        }

        .sidebar {
            width: 250px;
            background: rgba(26, 26, 46, 0.8);
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            transition: all 0.2s;
            text-transform: uppercase;
            font-weight: 700;
        }

        .sidebar-btn:hover {
            background: var(--primary);
            color: var(--bg-dark);
        }

        .sidebar-btn.active {
            background: var(--primary);
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, var(--bg-card) 0%, #16213e 100%);
            border: 2px solid var(--primary);
            border-radius: 12px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, rgba(0, 255, 204, 0.15) 0%, rgba(255, 27, 141, 0.15) 100%);
            padding: 15px;
            border-bottom: 1px solid rgba(0, 255, 204, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            color: var(--primary);
            font-size: 1.3rem;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .header-stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: var(--primary);
        }

        .header-controls {
            display: flex;
            gap: 8px;
        }

        .header-controls button {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            transition: all 0.2s;
        }

        .header-controls button:hover {
            background: var(--primary);
            color: var(--bg-dark);
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg-ia, .msg-user {
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .msg-ia { justify-content: flex-start; }
        .msg-ia span {
            background: rgba(0, 255, 204, 0.15);
            border: 1px solid rgba(0, 255, 204, 0.3);
            color: var(--primary);
            padding: 10px 14px;
            border-radius: 10px 10px 10px 4px;
            max-width: 70%;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .msg-user { justify-content: flex-end; }
        .msg-user span {
            background: linear-gradient(135deg, var(--primary), #00cc99);
            color: var(--bg-dark);
            padding: 10px 14px;
            border-radius: 10px 10px 4px 10px;
            max-width: 70%;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .mini-game {
            background: rgba(255, 27, 141, 0.15);
            border: 1px solid rgba(255, 27, 141, 0.3);
            padding: 12px;
            border-radius: 8px;
            margin-top: 8px;
        }

        .game-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .game-btn {
            background: rgba(255, 27, 141, 0.3);
            border: 1px solid var(--secondary);
            color: var(--secondary);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            transition: all 0.2s;
        }

        .game-btn:hover {
            background: rgba(255, 27, 141, 0.5);
            box-shadow: 0 0 10px rgba(255, 27, 141, 0.5);
        }

        .suggestions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .suggestion-btn {
            background: rgba(0, 255, 204, 0.2);
            border: 1px solid rgba(0, 255, 204, 0.3);
            color: var(--primary);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            transition: all 0.2s;
        }

        .suggestion-btn:hover {
            background: rgba(0, 255, 204, 0.4);
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
        }

        .input-section {
            background: rgba(0, 255, 204, 0.05);
            border-top: 1px solid rgba(0, 255, 204, 0.2);
            padding: 12px;
            display: flex;
            gap: 8px;
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 204, 0.3);
            color: var(--text);
            padding: 10px;
            border-radius: 6px;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 255, 204, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--primary), #00cc99);
            color: var(--bg-dark);
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .send-btn:hover {
            background: linear-gradient(135deg, var(--secondary), #ff6bb5);
            box-shadow: 0 0 15px rgba(255, 27, 141, 0.5);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 20px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            color: var(--text);
        }

        .modal-content h2 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }

        .achievement {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 0.8rem;
        }

        .achievement.locked {
            opacity: 0.3;
            border-color: rgba(200, 200, 200, 0.3);
        }

        .typing {
            display: flex;
            gap: 4px;
            padding: 10px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            animation: bounce 1.4s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        .confetti {
            position: fixed;
            pointer-events: none;
            animation: confetti-fall 2s ease-out forwards;
        }

        @keyframes confetti-fall {
            to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .container { flex-direction: column; }
            .msg-ia span, .msg-user span { max-width: 85%; }
        }

        .close-modal {
            float: right;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <button class="sidebar-btn active" onclick="switchTab('chat')">💬 Chat</button>
        <button class="sidebar-btn" onclick="switchTab('profile')">👤 Profil</button>
        <button class="sidebar-btn" onclick="switchTab('achievements')">🏆 Achievements</button>
        <button class="sidebar-btn" onclick="switchTab('stats')">📊 Stats</button>
        <button class="sidebar-btn" onclick="switchTab('games')">🎮 Jeux</button>
        <button class="sidebar-btn" onclick="switchTab('search')">🔍 Recherche</button>
        <button class="sidebar-btn" onclick="openModal('settings')">⚙️ Paramètres</button>
        <button class="sidebar-btn" onclick="exportChat()">📥 Export</button>
        <button class="sidebar-btn" onclick="openModal('daily')">📅 Défis</button>
        <button class="sidebar-btn" onclick="toggleTheme()">🎨 Thème</button>
        <button class="sidebar-btn" onclick="openModal('leaderboard')">🥇 Classement</button>
    </div>

    <div class="main-chat">
        <div class="header">
            <div class="header-left">
                <h1 id="title">🤖 CHATBOT IA V4</h1>
                <div style="font-size: 11px; color: rgba(0, 255, 204, 0.7);" id="userGreeting">Bienvenue!</div>
            </div>
            <div class="header-stats">
                <div>💬 <span id="msgCount">0</span></div>
                <div>🔥 <span id="streakCount">0</span></div>
                <div>⭐ <span id="scoreCount">0</span></div>
                <div>🎯 Lvl <span id="levelCount">1</span></div>
            </div>
            <div class="header-controls">
                <button onclick="clearChat()">🗑️</button>
                <button onclick="location.reload()">⟳</button>
            </div>
        </div>

        <div class="chat-box" id="chatBox"></div>

        <div class="input-section">
            <input type="text" id="chatInput" class="chat-input" placeholder="Type /help for commands..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">SEND</button>
        </div>
    </div>
</div>

<div id="modals">
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('profile')">&times;</span>
            <h2>👤 Profil</h2>
            <p id="profileInfo"></p>
        </div>
    </div>

    <div id="achievementsModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('achievements')">&times;</span>
            <h2>🏆 Achievements</h2>
            <div class="achievement-grid" id="achievementGrid"></div>
        </div>
    </div>

    <div id="statsModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('stats')">&times;</span>
            <h2>📊 Statistiques</h2>
            <p id="statsInfo"></p>
        </div>
    </div>

    <div id="gamesModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('games')">&times;</span>
            <h2>🎮 Mini-Jeux</h2>
            <p id="gamesInfo"></p>
        </div>
    </div>

    <div id="searchModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('search')">&times;</span>
            <h2>🔍 Rechercher</h2>
            <input type="text" placeholder="Cherche dans le chat..." id="searchInput" onkeyup="searchChat()" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--primary); background: rgba(0, 255, 204, 0.1); color: var(--text); font-family: 'Space Mono', monospace; margin-bottom: 10px;">
            <div id="searchResults" style="font-size: 0.9rem;"></div>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('settings')">&times;</span>
            <h2>⚙️ Paramètres</h2>
            <p>Langue: 
                <select id="langSelect" onchange="changeLanguage(this.value)" style="background: rgba(0, 255, 204, 0.2); border: 1px solid var(--primary); color: var(--text); padding: 5px; border-radius: 4px; font-family: 'Space Mono', monospace;">
                    <option value="fr">Français 🇫🇷</option>
                    <option value="en">English 🇬🇧</option>
                </select>
            </p>
            <p>
                <label>
                    <input type="checkbox" id="ttsToggle" onchange="toggleTTS()"> Activer Text-to-Speech
                </label>
            </p>
            <p>
                <label>
                    <input type="checkbox" id="oledToggle" onchange="toggleOLED()"> Mode OLED (Noir pur)
                </label>
            </p>
        </div>
    </div>

    <div id="dailyModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('daily')">&times;</span>
            <h2>📅 Défis Quotidiens</h2>
            <p id="dailyInfo"></p>
        </div>
    </div>

    <div id="leaderboardModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('leaderboard')">&times;</span>
            <h2>🥇 Classement</h2>
            <p id="leaderboardInfo"></p>
        </div>
    </div>
</div>

<script>
    // ========== DONNÉES & SYSTÈME DE SAUVEGARDE ==========
    const LANG = { fr: {}, en: {} };
    let currentLang = localStorage.getItem('lang') || 'fr';
    let gameState = JSON.parse(localStorage.getItem('gameState')) || {
        userName: null,
        messages: 0,
        streak: 0,
        score: 0,
        level: 1,
        history: [],
        achievements: {},
        dailyChallenges: { explored: 0, gamesPlayed: 0, eastereggs: 0, completed: false },
        favoriteTopics: {},
        lastReset: new Date().toDateString()
    };

    const ACHIEVEMENTS = {
        first_chat: { title: "First Chat", desc: "Envoie ton premier message", icon: "🎮" },
        100_msgs: { title: "Bavard", desc: "100 messages", icon: "💬" },
        500_msgs: { title: "Intarissable", desc: "500 messages", icon: "📢" },
        streak_10: { title: "Addict", desc: "Streak de 10", icon: "🔥" },
        win_game: { title: "Gamer", desc: "Gagne un mini-jeu", icon: "🎯" },
        easter_5: { title: "Explorateur", desc: "Trouve 5 easter eggs", icon: "🥚" },
        level_5: { title: "Novice", desc: "Atteins niveau 5", icon: "⭐" },
        explore_all: { title: "Curieux", desc: "Explore tous les sujets", icon: "🧠" }
    };

    // ========== FONCTION DE TRADUCTION ==========
    function translate(key) {
        return LANG[currentLang][key] || key;
    }

    // ========== MINI-JEUX ==========
    function playGame(type) {
        if (type === 'coinflip') {
            const result = Math.random() > 0.5 ? 'Heads 🪙' : 'Tails 🪙';
            addMessage(`Résultat: ${result}!`, 'bot');
            gameState.gamesPlayed = (gameState.gamesPlayed || 0) + 1;
            updateScore(50);
            unlockAchievement('win_game');
        }
        if (type === 'dice') {
            const result = Math.floor(Math.random() * 6) + 1;
            addMessage(`🎲 Résultat: ${result}!`, 'bot');
            gameState.gamesPlayed = (gameState.gamesPlayed || 0) + 1;
            updateScore(50 + result * 10);
            unlockAchievement('win_game');
        }
        if (type === 'quiz') {
            startQuiz();
        }
    }

    function startQuiz() {
        const questions = [
            { q: 'Qui a créé ZyntraCode?', a: 'mga', p: 50 },
            { q: 'Quel est notre jeu de combat?', a: 'arena', p: 40 },
            { q: 'ZyntraCode est basé où?', a: 'suisse', p: 30 },
            { q: 'Combien de features le bot Discord?', a: '10', p: 60 }
        ];
        const q = questions[Math.floor(Math.random() * questions.length)];
        addMessage(`🎯 Quiz: ${q.q}`, 'bot');
        window.currentQuizAnswer = q.a;
        window.currentQuizPoints = q.p;
    }

    // ========== SYSTÈME D'ACHIEVEMENTS ==========
    function unlockAchievement(achId) {
        if (!gameState.achievements[achId]) {
            gameState.achievements[achId] = true;
            throwConfetti();
            addMessage(`🏆 ACHIEVEMENT UNLOCK: ${ACHIEVEMENTS[achId].title}! +100 points!`, 'bot');
            updateScore(100);
        }
    }

    // ========== CONFETTI & ANIMATIONS ==========
    function throwConfetti() {
        for (let i = 0; i < 30; i++) {
            const conf = document.createElement('div');
            conf.className = 'confetti';
            conf.innerHTML = ['🎉', '⭐', '🔥', '💫', '✨'][Math.floor(Math.random() * 5)];
            conf.style.left = Math.random() * 100 + '%';
            conf.style.top = '0';
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), 2000);
        }
    }

    // ========== GESTION DES MESSAGES ==========
    function addMessage(text, sender = 'user') {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = sender === 'user' ? 'msg-user' : 'msg-ia';
        msgDiv.innerHTML = `<span>${text}</span>`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        
        if (sender === 'bot') {
            const msg = { text, sender, time: new Date() };
            gameState.history.push(msg);
            saveGame();
        }
    }

    function sendMessage() {
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (!msg) return;

        addMessage(msg, 'user');
        input.value = '';

        gameState.messages++;
        gameState.streak++;
        updateStats();
        unlockAchievement('first_chat');
        if (gameState.messages >= 100) unlockAchievement('100_msgs');
        if (gameState.messages >= 500) unlockAchievement('500_msgs');
        if (gameState.streak >= 10) unlockAchievement('streak_10');

        // Répondre avec IA simple
        setTimeout(() => {
            const response = generateResponse(msg);
            addMessage(response, 'bot');
            if (Math.random() > 0.7) throwConfetti();
        }, 400 + Math.random() * 600);
    }

    function generateResponse(msg) {
        const responses = [
            'Intéressant! 🤔',
            'J\'adore cette question! 😊',
            'Ouf, tu explores! 🚀',
            'Trop bien! 🔥',
            'Je vois! 👍',
            'Raconte plus! 📢',
            'Génial! ⭐'
        ];
        return responses[Math.floor(Math.random() * responses.length)];
    }

    function updateScore(points) {
        gameState.score += points;
        gameState.level = Math.floor(gameState.score / 500) + 1;
        updateStats();
    }

    function updateStats() {
        document.getElementById('msgCount').innerText = gameState.messages;
        document.getElementById('streakCount').innerText = gameState.streak;
        document.getElementById('scoreCount').innerText = gameState.score;
        document.getElementById('levelCount').innerText = gameState.level;
        if (gameState.userName) {
            document.getElementById('userGreeting').innerText = `Bienvenue, ${gameState.userName}! 👋`;
        }
    }

    function saveGame() {
        localStorage.setItem('gameState', JSON.stringify(gameState));
    }

    // ========== MODALES ==========
    function openModal(modalType) {
        const modal = document.getElementById(modalType + 'Modal');
        if (modal) {
            modal.classList.add('active');
            if (modalType === 'achievements') updateAchievementsModal();
            if (modalType === 'stats') updateStatsModal();
            if (modalType === 'daily') updateDailyModal();
            if (modalType === 'leaderboard') updateLeaderboardModal();
        }
    }

    function closeModal(modalType) {
        const modal = document.getElementById(modalType + 'Modal');
        if (modal) modal.classList.remove('active');
    }

    function updateAchievementsModal() {
        const grid = document.getElementById('achievementGrid');
        grid.innerHTML = '';
        for (let id in ACHIEVEMENTS) {
            const ach = ACHIEVEMENTS[id];
            const div = document.createElement('div');
            div.className = 'achievement' + (gameState.achievements[id] ? '' : ' locked');
            div.innerHTML = `<div style="font-size: 1.5rem;">${ach.icon}</div><div>${ach.title}</div>`;
            grid.appendChild(div);
        }
    }

    function updateStatsModal() {
        const stats = document.getElementById('statsInfo');
        stats.innerHTML = `
            <p>Messages: ${gameState.messages}</p>
            <p>Streak: ${gameState.streak}</p>
            <p>Score: ${gameState.score}</p>
            <p>Niveau: ${gameState.level}</p>
            <p>Achievements: ${Object.keys(gameState.achievements).length}/${Object.keys(ACHIEVEMENTS).length}</p>
        `;
    }

    function updateDailyModal() {
        const daily = document.getElementById('dailyInfo');
        const exp = 3 - gameState.dailyChallenges.explored;
        const games = 2 - gameState.dailyChallenges.gamesPlayed;
        const eggs = 2 - gameState.dailyChallenges.eastereggs;
        daily.innerHTML = `
            <p>📍 Explorer ${exp} sujets (${gameState.dailyChallenges.explored}/3)</p>
            <p>🎮 Jouer ${games} jeux (${gameState.dailyChallenges.gamesPlayed}/2)</p>
            <p>🥚 Trouver ${eggs} easter eggs (${gameState.dailyChallenges.eastereggs}/2)</p>
            <p>${gameState.dailyChallenges.completed ? '✅ Complété!' : '⏳ En cours'}</p>
            <button class="game-btn" onclick="resetDaily()">Reset pour demain</button>
        `;
    }

    function updateLeaderboardModal() {
        const board = document.getElementById('leaderboardInfo');
        board.innerHTML = `
            <p>🥇 1er: ${gameState.score} points</p>
            <p>📊 Ton ranking sera basé sur ton score</p>
            <p>Partage ton score pour le leaderboard global!</p>
        `;
    }

    function resetDaily() {
        gameState.dailyChallenges = { explored: 0, gamesPlayed: 0, eastereggs: 0, completed: false };
        saveGame();
        updateDailyModal();
    }

    // ========== UTILITAIRES ==========
    function clearChat() {
        document.getElementById('chatBox').innerHTML = '';
        gameState.history = [];
        saveGame();
    }

    function exportChat() {
        const data = JSON.stringify(gameState, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'chatbot_data.json';
        a.click();
    }

    function searchChat() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const results = document.getElementById('searchResults');
        results.innerHTML = '';
        gameState.history.filter(h => h.text.toLowerCase().includes(query)).forEach(h => {
            const div = document.createElement('p');
            div.innerHTML = `<strong>${h.sender}:</strong> ${h.text}`;
            div.style.fontSize = '0.85rem';
            div.style.marginBottom = '5px';
            div.style.padding = '5px';
            div.style.background = 'rgba(0, 255, 204, 0.1)';
            div.style.borderRadius = '4px';
            results.appendChild(div);
        });
    }

    function toggleTheme() {
        document.body.classList.toggle('theme-disco');
        localStorage.setItem('theme', document.body.classList.contains('theme-disco') ? 'disco' : 'default');
    }

    function toggleOLED() {
        const isOLED = document.getElementById('oledToggle').checked;
        if (isOLED) {
            document.documentElement.style.setProperty('--bg-dark', '#000000');
            document.documentElement.style.setProperty('--bg-card', '#000000');
        }
        localStorage.setItem('oled', isOLED);
    }

    function toggleTTS() {
        localStorage.setItem('tts', document.getElementById('ttsToggle').checked);
    }

    function changeLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('lang', lang);
        location.reload();
    }

    function switchTab(tab) {
        if (tab === 'chat') closeModal('profile');
        else if (tab === 'profile') openModal('profile');
        // ... autres tabs
    }

    // ========== INITIALISATION ==========
    document.addEventListener('DOMContentLoaded', () => {
        updateStats();
        if (localStorage.getItem('theme') === 'disco') toggleTheme();
        if (localStorage.getItem('oled')) document.getElementById('oledToggle').checked = true;
        
        const msg = document.createElement('div');
        msg.className = 'msg-ia';
        msg.innerHTML = `<span>Bienvenue sur ZyntraCode ChatBot V4 ULTIME! 🚀 Avec 18 features complètes: mini-jeux, achievements, daily challenges, leaderboard, TTS, multi-langue, et plus! Tape /help pour les commandes! 🎉</span>`;
        document.getElementById('chatBox').appendChild(msg);

        document.getElementById('chatInput').focus();
    });

    // Sauvegarde auto
    setInterval(saveGame, 5000);
</script>

</body>
</html>
