 <div class="chat-section">
            <h2>🧠 Chat IA</h2>
            <div class="chat-box" id="chat-box">
                <div class="msg-ia"><span>Bonjour {user.get('username', '')} ! Je suis l'IA de ZyntraCode 😊</span></div>
            </div>
            <div class="chat-input">
                <input type="text" id="chat-input" placeholder="Pose ta question..." onkeypress="if(event.key==='Enter') envoyerMessage()">
                <button onclick="envoyerMessage()">Envoyer</button>
            </div>
        </div>
    </div>
    <script>
        function envoyerMessage() {{
            const input = document.getElementById("chat-input");
            const chatBox = document.getElementById("chat-box");
            const message = input.value.trim();
            if (!message) return;
            chatBox.innerHTML += `<div class="msg-user"><span>${{message}}</span></div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;
            chatBox.innerHTML += `<div class="msg-ia" id="loading"><span>⏳ En train de réfléchir...</span></div>`;
            fetch("/api/chat", {{
                method: "POST",
                headers: {{"Content-Type": "application/json"}},
                body: JSON.stringify({{message: message}})
            }})
            .then(r => r.json())
            .then(data => {{
                document.getElementById("loading").remove();
                chatBox.innerHTML += `<div class="msg-ia"><span>${{data.reponse}}</span></div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }});
        }}
    </script>
</body>
</html>
"""
