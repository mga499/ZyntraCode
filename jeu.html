<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZyntraCode RPG</title>
    <link rel="icon" type="image/png" href="logo_zyntracode2.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a; color: white;
            font-family: Arial, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }

        /* ÉCRAN CONNEXION */
        #ecran-connexion {
            text-align: center; background: #1a1a1a;
            border: 1px solid rgb(21,213,168); border-radius: 15px;
            padding: 40px; max-width: 400px; width: 90%;
        }
        #ecran-connexion h1 { color: rgb(21,213,168); font-size: 28px; margin-bottom: 10px; }
        #ecran-connexion p { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        .btn-jeu {
            width: 100%; padding: 12px; background: rgb(21,213,168); color: black;
            border: 2px solid rgb(21,213,168); border-radius: 10px;
            font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 10px;
        }
        .btn-jeu:hover { background: transparent; color: rgb(21,213,168); }
        .btn-jeu.ghost { background: transparent; color: #aaa; border-color: #2a2a2a; }
        .btn-jeu.ghost:hover { border-color: #aaa; color: white; }

        /* JEU */
        #conteneur-jeu { display: none; position: relative; }

        /* HUD */
        #hud {
            display: flex; align-items: center; gap: 15px;
            padding: 8px 12px; background: #1a1a1a;
            border: 1px solid #2a2a2a; border-radius: 10px;
            margin-bottom: 8px; width: 640px;
        }
        #hud .hud-nom { color: rgb(21,213,168); font-weight: bold; font-size: 13px; }
        #hud .hud-niveau { color: #ffaa00; font-size: 11px; }
        .barre-vie { flex: 1; height: 10px; background: #2a2a2a; border-radius: 5px; overflow: hidden; }
        .barre-vie-remplie { height: 100%; background: #ff4d4d; border-radius: 5px; transition: width 0.3s; }
        .barre-xp { flex: 1; height: 6px; background: #2a2a2a; border-radius: 3px; overflow: hidden; }
        .barre-xp-remplie { height: 100%; background: rgb(21,213,168); border-radius: 3px; transition: width 0.3s; }
        #hud .hud-stats { color: #aaa; font-size: 11px; line-height: 1.6; }
        #hud-score { color: #ffaa00; font-size: 12px; font-weight: bold; }
        .btn-petit {
            padding: 5px 10px; background: transparent; color: #aaa;
            border: 1px solid #2a2a2a; border-radius: 6px;
            font-size: 11px; cursor: pointer; transition: 0.2s; white-space: nowrap;
        }
        .btn-petit:hover { border-color: rgb(21,213,168); color: rgb(21,213,168); }

        /* CANVAS */
        #canvas { border: 2px solid rgb(21,213,168); border-radius: 8px; display: block; }

        /* MESSAGE */
        #message-jeu {
            position: absolute; top: 55px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85); border: 1px solid rgb(21,213,168);
            border-radius: 8px; padding: 6px 18px; font-size: 13px;
            color: rgb(21,213,168); display: none; white-space: nowrap; z-index: 10;
        }

        /* CONTROLES */
        #controles {
            display: flex; gap: 8px; margin-top: 8px;
            width: 640px; justify-content: space-between; align-items: center;
        }
        #controles .info { color: #555; font-size: 11px; }

        /* ======== INVENTAIRE DRAWER ======== */
        #inv-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.6); z-index: 90;
            backdrop-filter: blur(2px);
            transition: opacity 0.3s;
        }
        #inv-overlay.actif { display: block; }

        #inventaire-panel {
            position: fixed; top: 0; right: 0; height: 100vh;
            width: 300px; background: #111;
            border-left: 1px solid rgb(21,213,168);
            z-index: 100; display: flex; flex-direction: column;
            transform: translateX(110%);
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        #inventaire-panel.ouvert { transform: translateX(0); }

        .inv-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; border-bottom: 1px solid #222; flex-shrink: 0;
        }
        .inv-header h2 { color: rgb(21,213,168); font-size: 16px; margin: 0; }
        .inv-btn-close {
            background: none; border: none; color: #555;
            font-size: 22px; cursor: pointer; line-height: 1;
            padding: 0 4px; transition: color 0.2s;
        }
        .inv-btn-close:hover { color: white; }

        .inv-tabs {
            display: flex; border-bottom: 1px solid #222; flex-shrink: 0;
        }
        .inv-tab {
            flex: 1; padding: 10px 8px; background: none; border: none;
            color: #555; font-size: 12px; cursor: pointer;
            border-bottom: 2px solid transparent; transition: 0.2s;
        }
        .inv-tab.actif { color: rgb(21,213,168); border-bottom-color: rgb(21,213,168); }
        .inv-tab:hover:not(.actif) { color: #aaa; }

        .inv-body {
            flex: 1; overflow-y: auto; padding: 12px 14px;
        }
        .inv-body::-webkit-scrollbar { width: 4px; }
        .inv-body::-webkit-scrollbar-track { background: #0a0a0a; }
        .inv-body::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

        .inv-section-content { display: none; flex-direction: column; gap: 8px; }
        .inv-section-content.actif { display: flex; }

        .inv-item {
            background: #0a0a0a; border: 1px solid #1e1e1e;
            border-radius: 10px; padding: 10px 12px;
            display: flex; align-items: center; justify-content: space-between;
            transition: border-color 0.2s; font-size: 13px;
        }
        .inv-item:hover { border-color: rgba(21,213,168,0.4); }
        .inv-item.equipe { border-color: rgb(21,213,168); background: rgba(21,213,168,0.04); }
        .inv-item .item-nom { color: white; font-size: 13px; }
        .inv-item .item-stats { color: #555; font-size: 11px; margin-top: 2px; }
        .inv-item .item-btn {
            padding: 4px 10px; background: rgb(21,213,168); color: black;
            border: none; border-radius: 6px; font-size: 11px;
            cursor: pointer; font-weight: bold;
            white-space: nowrap; flex-shrink: 0; margin-left: 8px;
            transition: opacity 0.2s;
        }
        .inv-item .item-btn:hover { opacity: 0.8; }
        .inv-item .item-btn.use { background: #ff6b6b; color: white; }
        .inv-item .item-btn.remove { background: #2a2a2a; color: #aaa; }
        .inv-vide { color: #444; font-size: 12px; text-align: center; padding: 24px 0; }

        /* DPAD MOBILE */
        #dpad { display: none; flex-direction: column; align-items: center; gap: 4px; margin-top: 12px; }
        .dpad-btn {
            width: 50px; height: 50px; background: #1a1a1a; border: 2px solid #2a2a2a;
            border-radius: 10px; color: white; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; user-select: none;
        }
        .dpad-btn:active { background: rgba(21,213,168,0.2); border-color: rgb(21,213,168); }
        .dpad-row { display: flex; gap: 4px; }

            #hud, #controles { width: 100%; max-width: 100vw; }
            #dpad { display: flex; }
            #inventaire-panel {
                top: auto; bottom: 0; right: 0; left: 0;
                width: 100%; height: 72vh;
                border-left: none; border-top: 1px solid rgb(21,213,168);
                border-radius: 16px 16px 0 0;
                transform: translateY(110%);
            }
            #inventaire-panel.ouvert { transform: translateY(0); }
        }
    </style>
</head>

    <p style="color:#555;font-size:12px;margin-top:10px;">Sans compte, la progression ne sera pas sauvegardée.</p>
</div>

<!-- JEU -->
<div id="conteneur-jeu">

        </div>

            <div style="color:#aaa;font-size:10px;margin:3px 0 1px;">✨ XP</div>
            <div class="barre-xp"><div class="barre-xp-remplie" id="barre-xp" style="width:0%"></div></div>
        </div>
        <div>
            <div class="hud-stats" id="hud-stats">⚔️ 10 🛡️ 5</div>
            <div id="hud-score">🏆 0</div>
            <div id="hud-cle" style="color: #ffaa00; font-size: 12px; font-weight: bold;">🗝️ Non</div>
        </div>
        <button class="btn-petit" onclick="toggleInventaire()">🎒 Inv.</button>
        <button class="btn-petit" onclick="sauvegarder()">💾</button>
    </div>

    <div style="position:relative;">
        <canvas id="canvas" width="640" height="480"></canvas>
        <div id="message-jeu"></div>
    </div>

    <div id="controles">
        <div class="info">🎮 Flèches/WASD = bouger · Espace = attaquer · I = inventaire</div>
        <button class="btn-petit" onclick="window.location.href='index.html'">🏠 Accueil</button>
    </div>

    <div id="dpad">
        <div class="dpad-row">
            <div class="dpad-btn" ontouchstart="touchDir('haut')" ontouchend="touchStop()">▲</div>
        </div>
        <div class="dpad-row">
            <div class="dpad-btn" ontouchstart="touchDir('gauche')" ontouchend="touchStop()">◀</div>

            <div class="dpad-btn" ontouchstart="touchDir('droite')" ontouchend="touchStop()">▶</div>
        </div>
        <div class="dpad-row">
            <div class="dpad-btn" ontouchstart="touchDir('bas')" ontouchend="touchStop()">▼</div>
        </div>
    </div>
</div>

];

let monstres = _templatesMonstresExt();

// ============================================
// INIT
// ============================================
async function init() {
    const { data:{ user } } = await supabaseClient.auth.getUser();
    if (user) { utilisateur = user; await chargerProgression(); demarrerJeu(); }
    else document.getElementById('ecran-connexion').style.display = 'block';
}

function jouerSansCompte() {
    document.getElementById('ecran-connexion').style.display = 'none';
    demarrerJeu();
}

function demarrerJeu() {
    document.getElementById('ecran-connexion').style.display = 'none';
    document.getElementById('conteneur-jeu').style.display = 'block';
    mettreAJourHUD();

    if (window.innerWidth <= 700) {
        document.getElementById('dpad').style.display = 'flex';
        // Taille de tuile fixe 32px sur mobile — la caméra suit le joueur
        // On calcule le canvas pour afficher ~10 tuiles en largeur et ~9 en hauteur
        const TC_MOBILE = 32;
        const tilesX = Math.floor((window.innerWidth - 16) / TC_MOBILE); // -16 pour les marges
        const tilesY = 9; // hauteur fixe
        canvas.width  = tilesX * TC_MOBILE;
        canvas.height = tilesY * TC_MOBILE;
        // Mettre à jour le HUD et controles à la même largeur
        document.getElementById('hud').style.width      = canvas.width + 'px';
        document.getElementById('controles').style.width = canvas.width + 'px';
    }

    document.addEventListener('keydown', e => {
        touches[e.key] = true;
        if (e.key === ' ') { e.preventDefault(); attaquer(); }
        if (e.key === 'i' || e.key === 'I') toggleInventaire();
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
    });
    document.addEventListener('keyup', e => { touches[e.key] = false; });

    if (utilisateur) setInterval(sauvegarder, 30000);
    gameLoop = setInterval(update, 150);
    // FIX: pas de render() isolé ici, update() appelle render() à chaque tick
}

// ============================================
// SAUVEGARDE
// ============================================
async function chargerProgression() {
    try {
        const { data } = await supabaseClient.from('personnages').select('*').eq('id', utilisateur.id).single();
        if (data) {
            // FIX: vie et vieMax sauvegardées séparément
            joueur.vieMax   = data.vie_max   || 100;
            joueur.vie      = Math.min(data.vie || 100, joueur.vieMax);
            joueur.attaque  = data.attaque   || 10;
            joueur.defense  = data.defense   || 5;
            joueur.niveau   = data.niveau    || 1;
            joueur.xp       = data.xp        || 0;
            joueur.xpMax    = joueur.niveau  * 100;
            joueur.score    = data.score     || 0;  // FIX: score chargé
            joueur.x        = Math.round(data.position_x) || 3;
            joueur.y        = Math.round(data.position_y) || 3;
            joueur.nom      = data.username  || utilisateur.email.split('@')[0];
            joueur.inventaire = data.inventaire || [];
            // FIX: on s'assure que les 3 slots existent toujours
            joueur.equipement = Object.assign(
                { arme:null, armure:null, bouclier:null },
                data.equipement || {}
            );
            // FIX: clé rechargée depuis sauvegarde
            cleObtenue = data.cle_obtenue || false;
            recalculerBonus();
        } else {
            joueur.nom = utilisateur.email.split('@')[0];
            await supabaseClient.from('personnages').insert({
                id: utilisateur.id, username: joueur.nom,
                niveau:1, xp:0, vie:100, vie_max:100,
                attaque:10, defense:5, score:0,
                position_x:3, position_y:3,
                inventaire:[], equipement:{}, cle_obtenue:false
            });
        }
    } catch(e) {
        console.error('Erreur chargement:', e);
        joueur.nom = utilisateur?.email?.split('@')[0] || 'Héros';
    }
}

async function sauvegarder() {
    if (!utilisateur) return;
    try {
        await supabaseClient.from('personnages').upsert({
            id: utilisateur.id, username: joueur.nom,
            niveau: joueur.niveau, xp: joueur.xp,
            vie: joueur.vie, vie_max: joueur.vieMax,  // FIX: vie_max sauvegardée
            attaque: joueur.attaque, defense: joueur.defense,
            score: joueur.score,                       // FIX: score sauvegardé
            position_x: joueur.x, position_y: joueur.y,
            inventaire: joueur.inventaire,
            equipement: joueur.equipement,
            cle_obtenue: cleObtenue,                   // FIX: clé sauvegardée
            updated_at: new Date().toISOString()
        });
        afficherMessage('💾 Sauvegardé !');
    } catch(e) { console.error('Erreur sauvegarde:', e); }
}

// ============================================
// INVENTAIRE
// ============================================
function ajouterObjet(objet) {
    if (!objet) return;
    joueur.inventaire.push({ ...objet, uid: Date.now() + Math.random() });
    afficherMessage(`📦 Obtenu : ${objet.emoji} ${objet.nom} !`);
    if (objet.type === 'cle') {
        cleObtenue = true;
        mettreAJourHUD();
    }
    mettreAJourInventaireUI();
}

function equiperObjet(uid) {
    const idx = joueur.inventaire.findIndex(o => o.uid === uid);
    if (idx === -1) return;
    const objet = joueur.inventaire[idx];

    if (objet.type === 'arme') {
        if (joueur.equipement.arme) joueur.inventaire.push({...OBJETS[joueur.equipement.arme], uid: Date.now() + Math.random()});
        joueur.equipement.arme = objet.id;
    } else if (objet.type === 'armure') {
        if (joueur.equipement.armure) joueur.inventaire.push({...OBJETS[joueur.equipement.armure], uid: Date.now() + Math.random()});
        joueur.equipement.armure = objet.id;
    } else if (objet.type === 'bouclier') {
        if (joueur.equipement.bouclier) joueur.inventaire.push({...OBJETS[joueur.equipement.bouclier], uid: Date.now() + Math.random()});
        joueur.equipement.bouclier = objet.id;
    }

    joueur.inventaire.splice(idx, 1);
    recalculerBonus();
    afficherMessage(`✅ ${objet.emoji} ${objet.nom} équipé !`);
    mettreAJourHUD();
    mettreAJourInventaireUI();
}

// FIX: fonction desequiper() manquante — ajoutée
function desequiper(slot) {
    const id = joueur.equipement[slot];
    if (!id || !OBJETS[id]) return;
    const objet = OBJETS[id];
    joueur.inventaire.push({ ...objet, uid: Date.now() + Math.random() });
    joueur.equipement[slot] = null;
    recalculerBonus();
    afficherMessage(`🔄 ${objet.emoji} ${objet.nom} retiré !`);
    mettreAJourHUD();
    mettreAJourInventaireUI();
}

function utiliserObjet(uid) {
    const idx = joueur.inventaire.findIndex(o => o.uid === uid);
    if (idx === -1) return;
    const objet = joueur.inventaire[idx];

    if (objet.type === 'potion') {
        joueur.vie = Math.min(joueur.vieMax, joueur.vie + objet.vie);
        afficherMessage(`🧪 +${objet.vie} ❤️`);
    } else if (objet.type === 'elixir') {
        joueur.attaque += objet.attaque;
        afficherMessage(`⚗️ +${objet.attaque} ⚔️ permanent !`);
    }

    joueur.inventaire.splice(idx, 1);
    mettreAJourHUD();
    mettreAJourInventaireUI();
}

function supprimerObjet(uid) {
    const idx = joueur.inventaire.findIndex(o => o.uid === uid);
    if (idx === -1) return;
    const objet = joueur.inventaire[idx];
    joueur.inventaire.splice(idx, 1);
    afficherMessage(`🗑️ ${objet.emoji} ${objet.nom} supprimé !`);
    mettreAJourInventaireUI();
}

function fusionnerObjets(uid1Str, uid2Str, equipe1, slot1, equipe2, slot2) {
    let obj1, obj2;

    // Récupérer obj1
    if (equipe1) {
        if (!joueur.equipement[slot1] || !OBJETS[joueur.equipement[slot1]]) return;
        obj1 = { ...OBJETS[joueur.equipement[slot1]], uid: uid1Str, equipe: true, slot: slot1 };
    } else {
        const idx = joueur.inventaire.findIndex(o => o.uid == uid1Str);
        if (idx === -1) return;
        obj1 = { ...joueur.inventaire[idx] };
    }

    // Récupérer obj2
    if (equipe2) {
        if (!joueur.equipement[slot2] || !OBJETS[joueur.equipement[slot2]]) return;
        obj2 = { ...OBJETS[joueur.equipement[slot2]], uid: uid2Str, equipe: true, slot: slot2 };
    } else {
        const idx = joueur.inventaire.findIndex(o => o.uid == uid2Str);
        if (idx === -1) return;
        obj2 = { ...joueur.inventaire[idx] };
    }

    // Vérifier même objet
    if ((obj1.id || obj1.nom) !== (obj2.id || obj2.nom)) {
        afficherMessage('❌ Tu peux fusionner que les objets identiques !');
        return;
    }

    // FIX: supprimer les objets AVANT d'en créer le nouveau
    // On supprime du plus grand index au plus petit pour éviter le décalage de tableau
    if (equipe1) {
        joueur.equipement[slot1] = null;
    } else {
        // Trouver l'index APRÈS une éventuelle suppression précédente
        const idx = joueur.inventaire.findIndex(o => o.uid == uid1Str);
        if (idx !== -1) joueur.inventaire.splice(idx, 1);
    }

    if (equipe2) {
        joueur.equipement[slot2] = null;
    } else {
        const idx = joueur.inventaire.findIndex(o => o.uid == uid2Str);
        if (idx !== -1) joueur.inventaire.splice(idx, 1);
    }

    // Créer le nouvel objet fusionné
    const nouvelObjet = { ...obj1 };
    nouvelObjet.uid  = Date.now() + Math.random();
    nouvelObjet.nom  = `${obj1.nom} v2`;
    // Retirer les propriétés liées à l'état d'équipement
    delete nouvelObjet.equipe;
    delete nouvelObjet.slot;

    if (nouvelObjet.attaque) nouvelObjet.attaque *= 2;
    if (nouvelObjet.defense) nouvelObjet.defense *= 2;
    if (nouvelObjet.vie)     nouvelObjet.vie     *= 2;
    if (nouvelObjet.desc)    nouvelObjet.desc     = nouvelObjet.desc.replace(/\d+/, m => m * 2) + ' (Fusionné!)';

    joueur.inventaire.push(nouvelObjet);

    afficherMessage(`✨ Fusion réussie ! ${nouvelObjet.nom} créé !`);
    recalculerBonus();
    mettreAJourHUD();
    mettreAJourInventaireUI();
}

function recalculerBonus() {
    joueur.bonusEquip = { attaque:0, defense:0 };
    ['arme','armure','bouclier'].forEach(slot => {
        const id = joueur.equipement[slot];
        if (id && OBJETS[id]) {
            joueur.bonusEquip.attaque += OBJETS[id].attaque || 0;
            joueur.bonusEquip.defense += OBJETS[id].defense || 0;
        }
    });
}

function toggleInventaire() {

    document.getElementById('inventaire-panel').classList.toggle('ouvert', inventaireOuvert);
    document.getElementById('inv-overlay').classList.toggle('actif', inventaireOuvert);

}

function mettreAJourInventaireUI() {
    const divEquip = document.getElementById('inv-equipements');
    divEquip.innerHTML = '';

    const slots = [
        { slot:'arme',    label:'⚔️ Arme' },
        { slot:'armure',  label:'🛡️ Armure' },
        { slot:'bouclier',label:'🔰 Bouclier' }
    ];

    slots.forEach(({ slot, label }) => {
        const id = joueur.equipement[slot];
        if (id && OBJETS[id]) {
            const obj = OBJETS[id];
            divEquip.innerHTML += `
                <div class="inv-item equipe">
                    <div>
                        <div class="item-nom">${obj.emoji} ${obj.nom}</div>
                        <div class="item-stats">${label} · ${obj.desc}</div>
                    </div>
                    <button class="item-btn remove" onclick="desequiper('${slot}')">Retirer</button>
                </div>`;
        }
    });

    const equips = joueur.inventaire.filter(o => ['arme','armure','bouclier'].includes(o.type));
    equips.forEach(obj => {
        divEquip.innerHTML += `
            <div class="inv-item">
                <div style="flex:1">
                    <div class="item-nom">${obj.emoji} ${obj.nom}</div>
                    <div class="item-stats">${obj.desc}</div>
                </div>
                <button class="item-btn" onclick="equiperObjet(${obj.uid})">Équiper</button>
                <button class="item-btn remove" onclick="supprimerObjet(${obj.uid})">🗑️</button>
            </div>`;
    });

    if (!equips.length && !slots.some(s => joueur.equipement[s.slot])) {
        divEquip.innerHTML = '<div class="inv-vide">Aucun équipement</div>';
    }

    const divConso = document.getElementById('inv-consommables');
    divConso.innerHTML = '';
    const consos = joueur.inventaire.filter(o => ['potion','elixir','cle'].includes(o.type));
    consos.forEach(obj => {
        divConso.innerHTML += `
            <div class="inv-item">
                <div style="flex:1">
                    <div class="item-nom">${obj.emoji} ${obj.nom}</div>
                    <div class="item-stats">${obj.desc}</div>
                </div>
                ${obj.type !== 'cle' ? `<button class="item-btn use" onclick="utiliserObjet(${obj.uid})">Utiliser</button>` : ''}
                <button class="item-btn remove" onclick="supprimerObjet(${obj.uid})">🗑️</button>
            </div>`;
    });
    if (!consos.length) divConso.innerHTML = '<div class="inv-vide">Aucun consommable</div>';

    // ==================== FUSION ====================
    const divFusion = document.getElementById('inv-fusion');
    divFusion.innerHTML = '';

    const tousLesObjets = [...joueur.inventaire];
    ['arme','armure','bouclier'].forEach(slot => {
        const id = joueur.equipement[slot];
        if (id && OBJETS[id]) {
            tousLesObjets.push({
                ...OBJETS[id],
                uid: `equip_${slot}`,
                equipe: true,
                slot: slot
            });
        }
    });

    const groupes = {};
    tousLesObjets.forEach(obj => {
        const key = obj.id || obj.nom;
        if (!groupes[key]) groupes[key] = [];
        groupes[key].push(obj);
    });

    const fusionnables = Object.entries(groupes).filter(([, objets]) => objets.length >= 2);

    if (fusionnables.length === 0) {
        divFusion.innerHTML = '<div class="inv-vide">Trouve 2 objets identiques pour fusionner !</div>';
        return;
    }

    fusionnables.forEach(([, objets]) => {
        const obj = objets[0];
        divFusion.innerHTML += `<div style="color:#aaa;font-size:12px;margin:10px 0 8px;font-weight:bold;">🔗 ${obj.emoji} ${obj.nom} (${objets.length})</div>`;

        for (let i = 0; i < objets.length - 1; i++) {
            const o1 = objets[i];
            const o2 = objets[i + 1];
            const label1 = o1.equipe ? `📌 ${o1.nom}` : o1.nom;
            const label2 = o2.equipe ? `📌 ${o2.nom}` : o2.nom;
            const uid1  = o1.uid;
            const uid2  = o2.uid;
            const eq1   = o1.equipe ? 'true' : 'false';
            const eq2   = o2.equipe ? 'true' : 'false';
            const slot1 = o1.slot || '';
            const slot2 = o2.slot || '';

            divFusion.innerHTML += `
                <div class="inv-item">
                    <div style="flex:1">
                        <div class="item-nom">⚗️ Fusionner</div>
                        <div class="item-stats">${o1.emoji} ${label1} + ${o2.emoji} ${label2}</div>
                    </div>
                    <button class="item-btn" style="background:#ff9800;color:white;" onclick="fusionnerObjets('${uid1}','${uid2}',${eq1},'${slot1}',${eq2},'${slot2}')">Fusionner</button>
                </div>`;
        }
    });
}

// ============================================
// LOGIQUE JEU
// ============================================
function update() {
    if (inventaireOuvert) return;
    const now = Date.now();
    if (now - dernierMouvement < 150) return;

    let dx=0, dy=0;
    if (touches['ArrowUp']    || touches['w'] || touches['W']) dy=-1;
    if (touches['ArrowDown']  || touches['s'] || touches['S']) dy=1;
    if (touches['ArrowLeft']  || touches['a'] || touches['A']) dx=-1;
    if (touches['ArrowRight'] || touches['d'] || touches['D']) dx=1;
    if (touches['f'] || touches['F']) attaquer();

    if (dx || dy) { deplacer(dx, dy); dernierMouvement = now; }

    monstres.forEach(m => {
        if (!m.actif) return;
        if (Math.random() < 0.3) {
            const dirs = [{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}];
            const d = dirs[Math.floor(Math.random() * dirs.length)];
            const nx = m.x + d.dx, ny = m.y + d.dy;
            if (estLibre(nx, ny) && !(nx===joueur.x && ny===joueur.y)) { m.x=nx; m.y=ny; }

            if (Math.abs(m.x-joueur.x) <= 1 && Math.abs(m.y-joueur.y) <= 1 && !joueur.invincible) {
                const degats = Math.max(1, m.attaque - (joueur.defense + joueur.bonusEquip.defense));
                joueur.vie = Math.max(0, joueur.vie - degats);
                joueur.invincible = true;
                setTimeout(() => joueur.invincible = false, 1000);
                afficherMessage(`💔 -${degats} vie !`);
                mettreAJourHUD();
                if (joueur.vie <= 0) mourir();
            }
        }
    });

    if (messageTimer > 0 && --messageTimer === 0)
        document.getElementById('message-jeu').style.display = 'none';

    render();
}

function deplacer(dx, dy) {
    const nx = joueur.x + dx, ny = joueur.y + dy;

    // Transition maison
    if (localisationActuelle === 'exterieur' && carteExterieur[ny] && carteExterieur[ny][nx] === MAISON) {
        entrerMaison();
        return;
    }
    if (localisationActuelle === 'maison' && carteInterieurMaison[ny] && carteInterieurMaison[ny][nx] === PORTE) {
        sortirMaison();
        return;
    }

    // Transition niveau 2
    if (localisationActuelle === 'exterieur' && carteExterieur[ny] && carteExterieur[ny][nx] === PORTE_N2) {
        if (cleObtenue) {
            entrerNiveau2();
        } else {
            afficherMessage('🔒 Tu as besoin d\'une clé pour entrer ici !');
        }
        return;
    }
    if (localisationActuelle === 'niveau2' && carteNiveau2[ny] && carteNiveau2[ny][nx] === PORTE) {
        sortirNiveau2();
        return;
    }

    if (!estLibre(nx, ny)) return;
    joueur.x = nx; joueur.y = ny;

    // Ramasser la clé
    if (localisationActuelle === 'exterieur' && carteExterieur[ny][nx] === CLEE && !cleObtenue) {
        ajouterObjet(OBJETS.cle);
        carteExterieur[ny][nx] = HERBE;  // FIX: on modifie bien carteExterieur explicitement
    }

    // Coffres — FIX: chaque zone a sa propre liste de coffres et sa propre carte active
    if (localisationActuelle === 'exterieur') {
        coffres.forEach(c => {
            if (c.x===nx && c.y===ny && !c.ouvert) {
                c.ouvert = true;
                carteExterieur[c.y][c.x] = HERBE;
                if (c.loot) ajouterObjet(c.loot); else afficherMessage('📦 Coffre vide...');
                joueur.score += 50; mettreAJourHUD();
            }
        });
    } else if (localisationActuelle === 'maison') {
        coffresInterieur.forEach(c => {
            if (c.x===nx && c.y===ny && !c.ouvert) {
                c.ouvert = true;
                carteInterieurMaison[c.y][c.x] = HERBE;
                if (c.loot) ajouterObjet(c.loot); else afficherMessage('📦 Coffre vide...');
                joueur.score += 50; mettreAJourHUD();
            }
        });
    } else if (localisationActuelle === 'niveau2') {
        coffresNiveau2.forEach(c => {
            if (c.x===nx && c.y===ny && !c.ouvert) {
                c.ouvert = true;
                carteNiveau2[c.y][c.x] = HERBE;
                if (c.loot) ajouterObjet(c.loot); else afficherMessage('📦 Coffre vide...');
                joueur.score += 50; mettreAJourHUD();
            }
        });
    }
}

function entrerMaison() {
    localisationActuelle = 'maison';
    carte = carteInterieurMaison;
    joueur.x = 2; joueur.y = 7;
    afficherMessage('🏠 Vous entrez dans la maison...');
    monstres = []; // Maison vide de monstres (voulu)
}

function sortirMaison() {
    localisationActuelle = 'exterieur';
    carte = carteExterieur;
    joueur.x = 16; joueur.y = 9;
    afficherMessage('🌳 Vous sortez de la maison...');
    // FIX: on utilise la fonction template pour recréer les monstres proprement
    monstres = _templatesMonstresExt();
}

function entrerNiveau2() {
    localisationActuelle = 'niveau2';
    carte = carteNiveau2;
    joueur.x = 2; joueur.y = 13;
    afficherMessage('🕌 Bienvenue au niveau 2 ! Monstres plus forts...');
    monstres = _templatesMonstresN2();
}

function sortirNiveau2() {
    localisationActuelle = 'exterieur';
    carte = carteExterieur;
    joueur.x = 18; joueur.y = 1;
    afficherMessage('🌳 Vous êtes revenu au niveau 1...');
    monstres = _templatesMonstresExt();
}

function attaquer() {
    if (inventaireOuvert) return;
    let touche = false;
    monstres.forEach(m => {
        if (!m.actif) return;
        if (Math.abs(m.x-joueur.x) <= 1 && Math.abs(m.y-joueur.y) <= 1) {
            const degats = Math.max(1, (joueur.attaque + joueur.bonusEquip.attaque) - 2);
            m.vie -= degats;
            afficherMessage(`⚔️ -${degats} sur ${m.nom} !`);
            touche = true;
            if (m.vie <= 0) {
                m.actif = false;
                joueur.xp += m.xp;
                joueur.score += m.score;
                if (m.loot) ajouterObjet(m.loot);
                afficherMessage(`✨ +${m.xp} XP ! ${m.nom} vaincu !`);
                verifierNiveau();
                mettreAJourHUD();
            }
        }
    });
    if (!touche) afficherMessage('⚔️ Pas d\'ennemi à portée !');
}

function verifierNiveau() {
    if (joueur.xp >= joueur.xpMax) {
        joueur.xp -= joueur.xpMax;
        joueur.niveau++;
        joueur.xpMax = joueur.niveau * 100;
        joueur.vieMax += 20; joueur.vie = joueur.vieMax;
        joueur.attaque += 3; joueur.defense += 2;
        afficherMessage(`🎉 NIVEAU ${joueur.niveau} ! Stats améliorées !`);
        mettreAJourHUD();
    }
}

function mourir() {
    joueur.vie = Math.floor(joueur.vieMax * 0.5);
    // FIX: si mort dans maison ou niveau2, on revient à l'extérieur aussi
    if (localisationActuelle !== 'exterieur') {
        sortirMaison(); // reset carte
        localisationActuelle = 'exterieur';
        carte = carteExterieur;
    }
    joueur.x = 3; joueur.y = 3;
    afficherMessage('💀 Tu es mort ! Retour au début...');
    mettreAJourHUD();
}

function getCols()   { return localisationActuelle === 'maison' ? 10 : 20; }
function getLignes() { return localisationActuelle === 'maison' ? 10 : 15; }

function estLibre(x, y) {
    const cols   = getCols();
    const lignes = getLignes();
    if (x < 0 || x >= cols || y < 0 || y >= lignes) return false;
    if ([MUR, EAU, ARBRE].includes(carte[y][x])) return false;
    if (monstres.some(m => m.actif && m.x === x && m.y === y)) return false;
    return true;
}

function render() {
    const W = canvas.width, H = canvas.height;
    const COLS_LOCAL   = getCols();
    const LIGNES_LOCAL = getLignes();
    // Sur mobile : tuile fixe 32px (la caméra suit le joueur, on n'affiche pas toute la carte)
    // Sur desktop : on cale la carte entière dans le canvas
    const isMobile = window.innerWidth <= 700;
    const TC = isMobile ? 32 : Math.floor(W / COLS_LOCAL);
    ctx.clearRect(0, 0, W, H);

    const camX = Math.max(0, Math.min(COLS_LOCAL   - Math.floor(W/TC), joueur.x - Math.floor(W/TC/2)));
    const camY = Math.max(0, Math.min(LIGNES_LOCAL - Math.floor(H/TC), joueur.y - Math.floor(H/TC/2)));

    for (let y = camY; y < Math.min(LIGNES_LOCAL, camY + Math.ceil(H/TC) + 1); y++) {
        for (let x = camX; x < Math.min(COLS_LOCAL, camX + Math.ceil(W/TC) + 1); x++) {
            const tile = carte[y][x];
            const px = (x - camX) * TC, py = (y - camY) * TC;
            ctx.fillStyle = COULEURS[tile] || '#1a3a1a';
            ctx.fillRect(px, py, TC, TC);
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.strokeRect(px, py, TC, TC);
            const em = EMOJIS[tile];
            if (em) {
                ctx.font = `${TC * 0.7}px serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(em, px + TC/2, py + TC/2);
            }
        }
    }

    monstres.forEach(m => {
        if (!m.actif) return;
        const px = (m.x - camX) * TC, py = (m.y - camY) * TC;
        if (px < -TC || px > W || py < -TC || py > H) return;
        ctx.font = `${TC * 0.8}px serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(m.nom, px + TC/2, py + TC/2);
        const pct = m.vie / m.vieMax;
        ctx.fillStyle = '#ff4d4d';
        ctx.fillRect(px + 2, py - 5, (TC - 4) * pct, 3);
    });

    const pjx = (joueur.x - camX) * TC, pjy = (joueur.y - camY) * TC;
    if (!joueur.invincible || Math.floor(Date.now()/100) % 2 === 0) {
        ctx.fillStyle = 'rgba(21,213,168,0.15)';
        ctx.beginPath();
        ctx.ellipse(pjx + TC/2, pjy + TC - 4, TC/3, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = `${TC * 0.85}px serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🧙', pjx + TC/2, pjy + TC/2);
    }

    const arme = joueur.equipement.arme ? OBJETS[joueur.equipement.arme] : null;
    if (arme) {
        ctx.font = `${TC * 0.5}px serif`;
        ctx.fillText(arme.emoji, pjx + TC - 2, pjy + 4);
    }

    ctx.fillStyle = 'rgb(21,213,168)';
    ctx.font = `bold ${TC * 0.32}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(joueur.nom, pjx + TC/2, pjy - 3);
}

function mettreAJourHUD() {
    const attTot = joueur.attaque + joueur.bonusEquip.attaque;
    const defTot = joueur.defense + joueur.bonusEquip.defense;
    document.getElementById('hud-nom').textContent    = joueur.nom;
    document.getElementById('hud-niveau').textContent = `⭐ Niv. ${joueur.niveau}`;
    document.getElementById('hud-vie-txt').textContent = `${joueur.vie}/${joueur.vieMax}`;
    document.getElementById('hud-stats').textContent  = `⚔️ ${attTot} 🛡️ ${defTot}`;
    document.getElementById('hud-score').textContent  = `🏆 ${joueur.score}`;
    document.getElementById('hud-cle').textContent    = `🗝️ ${cleObtenue ? 'Oui' : 'Non'}`;
    document.getElementById('barre-vie').style.width  = `${(joueur.vie / joueur.vieMax) * 100}%`;
    document.getElementById('barre-xp').style.width   = `${(joueur.xp  / joueur.xpMax)  * 100}%`;
}

function afficherMessage(msg) {
    const el = document.getElementById('message-jeu');
    el.textContent = msg; el.style.display = 'block'; messageTimer = 15;
}

function touchDir(dir) {
    touches['ArrowUp'] = touches['ArrowDown'] = touches['ArrowLeft'] = touches['ArrowRight'] = false;
    if (dir === 'haut')   touches['ArrowUp']    = true;
    if (dir === 'bas')    touches['ArrowDown']  = true;
    if (dir === 'gauche') touches['ArrowLeft']  = true;
    if (dir === 'droite') touches['ArrowRight'] = true;
}
function touchStop() {
    touches['ArrowUp'] = touches['ArrowDown'] = touches['ArrowLeft'] = touches['ArrowRight'] = false;
}

init();
</script>
