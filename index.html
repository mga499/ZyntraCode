<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZyntraCode</title>
    <link rel="stylesheet" href="6-styles_page_boutique.css">
</head>

<body>

<div class="box">
   <h1 id="ZyntraCode2">ZyntraCode</h1> 
   <br>
   <h3 id="txt_inver">Bots Discord • Sites Web • Solutions Digitales</h3>
   <br>
   <input id="test_champ" type="search"  placeholder="🔎Recherche">
  </div>
<div id="resultats"></div>
<button id="menu-btn">☰ Menu</button>

<!-- Bouton hamburger -->
<div class="menu-btn2" onclick="toggleMenu()">
  <span></span>
  <span></span>
  <span></span>
</div>


<head>
<style>
.hidden {
  display: none;
}

#menu {
  background: #333;
  width: 150px;
  height: 600px; /*auteur*/
  position: fixed;
  top: 40px;
  z-index: 1000;
  border-radius:10px;
  box-shadow: 0px 0px 15px rgb(21, 213, 168);
  text-decoration: none;
  color: white;
  padding: 10px;
  transition: 0.3s;
}

#menu a {
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  display: block;
  padding: 10px;
}

#menu a:hover {
  color: rgb(21, 213, 168);
}


#recherche{
    padding:10px;
    width:250px;
    border-radius:10px;
}

#resultats{
    background:black;
    color:white;
    width:250px;
    margin:auto;
}

#resultats a{
    text-decoration:none;
    color:white;
}

#resultats p{
    padding:10px;
    margin:0;
    cursor:pointer;
}

#resultats p:hover{
    background:gray;
}
    
</style>
</head>

<body>


<nav id="menu" class="hidden">
  <a href="index.html">Accueil</a>
  <a href="2-Bot_discord.html">Bot Discord</a>
  <a href="3-contact.html">Contact</a>
</nav>

<script>
const btn = document.getElementById("menu-btn");
const menu = document.getElementById("menu");

btn.addEventListener("click", () => {
  menu.classList.toggle("hidden");
});

//=====================
//bar de recherche//
//=====================
    const mots = [
        {nom: "Modérion", lien: "index.html"},
];

const input = document.getElementById("test_champ");
const resultats = document.getElementById("resultats");

input.addEventListener("input", function(){

let valeur = input.value.toLowerCase();
resultats.innerHTML = "";

if(valeur === "") return;

let filtres = mots.filter(item =>
item.nom.toLowerCase().startsWith(valeur)
);

if (filtres.length === 0){
    resultats.innerHTML = "<p>Aucun résultat trouvé</p>";
}

filtres.forEach(item => {
resultats.innerHTML += `
<a href="${item.lien}">
<p>${item.nom}</p>
</a>
`;
});

});
</script>

<img src="image_modérion">

</body>
</html>
