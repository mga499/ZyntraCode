<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertisseur de police</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Pacifico&family=Satisfy&family=Great+Vibes&family=Sacramento&family=Caveat:wght@400;700&family=Kalam:wght@400;700&family=Indie+Flower&family=Shadows+Into+Light&family=Permanent+Marker&family=Rock+Salt&family=Homemade+Apple&family=Mr+Dafoe&family=Lobster&family=Yellowtail&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0e0e12;--surface:#16161d;--border:#2a2a36;
      --text:#e8e8f0;--dim:#6b6b80;--accent:#a78bfa;--accent2:#7c3aed;--success:#34d399;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px 60px}
    header{text-align:center;margin-bottom:40px}
    header h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:600;letter-spacing:-.02em}
    header p{color:var(--dim);margin-top:8px;font-size:.95rem}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:820px;margin-bottom:20px}
    .card h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:14px;display:flex;align-items:center;gap:8px}
    .badge-u{background:#1e1a2e;border:1px solid var(--accent2);color:var(--accent);font-size:.65rem;padding:2px 7px;border-radius:10px;font-family:inherit;text-transform:uppercase}
    textarea{width:100%;min-height:110px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:1rem;padding:14px 16px;resize:vertical;transition:border-color .2s;line-height:1.6}
    textarea:focus{outline:none;border-color:var(--accent)}
    textarea::placeholder{color:var(--dim)}
    .tabs{display:flex;gap:8px;margin-bottom:16px}
    .tab{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s}
    .tab:hover{border-color:var(--accent);color:var(--text)}
    .tab.active{background:var(--accent2);border-color:var(--accent2);color:white}
    .font-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
    .font-btn{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px 10px;cursor:pointer;text-align:center;transition:border-color .15s,background .15s,transform .1s;display:flex;flex-direction:column;gap:6px;align-items:center}
    .font-btn:hover{border-color:var(--accent);background:#16101f;transform:translateY(-1px)}
    .font-btn.active{border-color:var(--accent);background:#1a1030;box-shadow:0 0 0 1px var(--accent2)}
    .font-btn .preview{font-size:1.4rem;line-height:1.3;color:var(--text)}
    .font-btn .name{font-size:.68rem;color:var(--dim);font-family:inherit}
    .tab-panel{display:none}
    .tab-panel.active{display:block}
    .size-row{display:flex;align-items:center;gap:16px}
    .size-row input[type=range]{flex:1;accent-color:var(--accent);height:4px;cursor:pointer}
    .size-label{font-size:.85rem;color:var(--dim);min-width:40px;text-align:right}
    .color-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    .color-swatch{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .15s,transform .1s}
    .color-swatch:hover{transform:scale(1.1)}
    .color-swatch.active{border-color:white}
    input[type=color]{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);background:none;cursor:pointer;padding:0;overflow:hidden}
    #preview-area{min-height:80px;padding:20px;background:var(--bg);border:1px solid var(--border);border-radius:10px;word-break:break-word;white-space:pre-wrap;line-height:1.6;transition:font-family .2s,color .2s}
    #preview-empty{color:var(--dim);font-family:inherit;font-size:.9rem;font-style:italic}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    .btn{padding:10px 20px;border-radius:8px;border:none;font-size:.9rem;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;display:flex;align-items:center;gap:8px}
    .btn:hover{opacity:.88;transform:translateY(-1px)}
    .btn-primary{background:var(--accent2);color:white}
    .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
    #toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--success);color:#0e0e12;padding:10px 22px;border-radius:30px;font-weight:600;font-size:.9rem;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>

<header>
  <h1>Convertisseur de police</h1>
  <p>Écris ton texte, choisis un style, copie le résultat.</p>
</header>

<div class="card">
  <h2>Ton texte</h2>
  <textarea id="input-text" placeholder="Écris quelque chose ici..."></textarea>
</div>

<div class="card">
  <h2>Style <span class="badge-u" id="unicode-badge" style="display:none">Unicode — copiable partout</span></h2>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('fonts')">✍️ Polices</button>
    <button class="tab" onclick="switchTab('unicode')">Unicode ✦</button>
  </div>
  <div class="tab-panel active" id="panel-fonts"><div class="font-grid" id="font-grid"></div></div>
  <div class="tab-panel" id="panel-unicode"><div class="font-grid" id="unicode-grid"></div></div>
</div>

<div class="card" id="size-card">
  <h2>Taille</h2>
  <div class="size-row">
    <input type="range" id="size-range" min="16" max="72" value="32">
    <span class="size-label" id="size-display">32px</span>
  </div>
</div>

<div class="card">
  <h2>Couleur</h2>
  <div class="color-row" id="color-row"></div>
</div>

<div class="card">
  <h2>Aperçu</h2>
  <div id="preview-area"><span id="preview-empty">L'aperçu apparaît ici…</span></div>
</div>

<div class="card">
  <h2>Exporter</h2>
  <div class="actions">
    <button class="btn btn-primary" onclick="copyText()">📋 Copier le texte</button>
    <button class="btn btn-outline" id="btn-html" onclick="copyHTML()">🔗 Copier en HTML</button>
    <button class="btn btn-outline" onclick="downloadPNG()">🖼️ Télécharger PNG</button>
    <button class="btn btn-outline" onclick="resetAll()">↺ Réinitialiser</button>
  </div>
</div>

<div id="toast"></div>

<script>
// =====================================================
// POLICES GOOGLE FONTS
// =====================================================
const FONTS = [
  { name:"Dancing Script",     family:"'Dancing Script',cursive" },
  { name:"Pacifico",           family:"'Pacifico',cursive" },
  { name:"Satisfy",            family:"'Satisfy',cursive" },
  { name:"Great Vibes",        family:"'Great Vibes',cursive" },
  { name:"Sacramento",         family:"'Sacramento',cursive" },
  { name:"Caveat",             family:"'Caveat',cursive" },
  { name:"Kalam",              family:"'Kalam',cursive" },
  { name:"Indie Flower",       family:"'Indie Flower',cursive" },
  { name:"Shadows Into Light", family:"'Shadows Into Light',cursive" },
  { name:"Permanent Marker",   family:"'Permanent Marker',cursive" },
  { name:"Rock Salt",          family:"'Rock Salt',cursive" },
  { name:"Homemade Apple",     family:"'Homemade Apple',cursive" },
  { name:"Mr Dafoe",           family:"'Mr Dafoe',cursive" },
  { name:"Lobster",            family:"'Lobster',cursive" },
  { name:"Yellowtail",         family:"'Yellowtail',cursive" },
];

// =====================================================
// STYLES UNICODE — maps via codepoints pour éviter
// les problèmes de surrogate pairs
// =====================================================

// Génère un tableau de 26 caractères à partir d'un codepoint de départ
function codeRange(start, count) {
  return Array.from({length: count}, (_, i) => String.fromCodePoint(start + i));
}

function buildMap(upperArr, lowerArr, digitArr) {
  const m = {};
  const UP = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const LO = "abcdefghijklmnopqrstuvwxyz";
  const DI = "0123456789";
  if (upperArr) UP.split("").forEach((c,i) => { if(upperArr[i]) m[c] = upperArr[i]; });
  if (lowerArr) LO.split("").forEach((c,i) => { if(lowerArr[i]) m[c] = lowerArr[i]; });
  if (digitArr) DI.split("").forEach((c,i) => { if(digitArr[i]) m[c] = digitArr[i]; });
  return m;
}

function conv(text, map) {
  return [...text].map(c => map[c] ?? c).join("");
}

// Double Struck (𝔸 = U+1D538 pour A, 𝕒 = U+1D552 pour a)
// Exceptions : C=ℂ, H=ℍ, N=ℕ, P=ℙ, Q=ℚ, R=ℝ, Z=ℤ
function makeDoubleStruck() {
  const up = codeRange(0x1D538, 26);
  up[2]  = "\u2102"; // C
  up[7]  = "\u210D"; // H
  up[13] = "\u2115"; // N
  up[15] = "\u2119"; // P
  up[16] = "\u211A"; // Q
  up[17] = "\u211D"; // R
  up[25] = "\u2124"; // Z
  const lo = codeRange(0x1D552, 26);
  const di = codeRange(0x1D7D8, 10);
  return buildMap(up, lo, di);
}

// Bold Script (𝓐 = U+1D4D0, 𝓪 = U+1D4EA)
function makeBoldScript() {
  return buildMap(codeRange(0x1D4D0,26), codeRange(0x1D4EA,26));
}

// Script (𝒜 = U+1D49C, avec exceptions)
function makeScript() {
  const up = codeRange(0x1D49C, 26);
  up[1]  = "\u212C"; // B
  up[4]  = "\u2130"; // E
  up[5]  = "\u2131"; // F
  up[7]  = "\u210B"; // H
  up[8]  = "\u2110"; // I
  up[11] = "\u2112"; // L
  up[12] = "\u2133"; // M
  up[14] = "\u2134"; // O — correction: O script = ℴ (lower) mais majuscule pas dispo, garde U+1D4AA
  up[16] = "\u211B"; // R
  up[17] = String.fromCodePoint(0x1D4AE); // S — correction
  const lo = codeRange(0x1D4B6, 26);
  lo[4]  = "\u212F"; // e
  lo[6]  = "\u210A"; // g
  lo[14] = "\u2134"; // o
  return buildMap(up, lo);
}

// Gothic / Fraktur (𝔄 = U+1D504)
function makeFraktur() {
  const up = codeRange(0x1D504, 26);
  up[2]  = "\u212D"; // C
  up[7]  = "\u210C"; // H
  up[8]  = "\u2111"; // I
  up[17] = "\u211C"; // R
  up[25] = "\u2128"; // Z
  const lo = codeRange(0x1D51E, 26);
  return buildMap(up, lo);
}

// Bold Fraktur (𝕬 = U+1D56C)
function makeBoldFraktur() {
  return buildMap(codeRange(0x1D56C,26), codeRange(0x1D586,26));
}

// Bold (𝐀 = U+1D400, 𝐚 = U+1D41A)
function makeBold() {
  return buildMap(codeRange(0x1D400,26), codeRange(0x1D41A,26), codeRange(0x1D7CE,10));
}

// Italic (𝐴 = U+1D434, 𝑎 = U+1D44E)
function makeItalic() {
  const up = codeRange(0x1D434, 26);
  const lo = codeRange(0x1D44E, 26);
  lo[8] = "\u0131"; // dotless i
  return buildMap(up, lo);
}

// Bold Italic (𝑨 = U+1D468)
function makeBoldItalic() {
  return buildMap(codeRange(0x1D468,26), codeRange(0x1D482,26));
}

// Monospace (𝙰 = U+1D670)
function makeMono() {
  return buildMap(codeRange(0x1D670,26), codeRange(0x1D68A,26), codeRange(0x1D7F6,10));
}

// Fullwidth (Ａ = U+FF21)
function makeFullwidth() {
  return buildMap(codeRange(0xFF21,26), codeRange(0xFF41,26), codeRange(0xFF10,10));
}

// Circled (Ⓐ = U+24B6)
function makeCircled() {
  return buildMap(codeRange(0x24B6,26), codeRange(0x24D0,26), ["⓪","①","②","③","④","⑤","⑥","⑦","⑧","⑨"]);
}

// Small caps
const SMALL_CAPS_MAP = buildMap(null, {
  split:()=>[]
}, null);
function makeSmallCaps() {
  const pairs = {
    a:"ᴀ",b:"ʙ",c:"ᴄ",d:"ᴅ",e:"ᴇ",f:"ꜰ",g:"ɢ",h:"ʜ",i:"ɪ",j:"ᴊ",k:"ᴋ",l:"ʟ",
    m:"ᴍ",n:"ɴ",o:"ᴏ",p:"ᴘ",q:"q",r:"ʀ",s:"ꜱ",t:"ᴛ",u:"ᴜ",v:"ᴠ",w:"ᴡ",x:"x",y:"ʏ",z:"ᴢ"
  };
  const m = {};
  Object.entries(pairs).forEach(([k,v]) => { m[k]=v; m[k.toUpperCase()]=v.toUpperCase(); });
  return m;
}

// Superscript
function makeSuperscript() {
  const pairs = {
    a:"ᵃ",b:"ᵇ",c:"ᶜ",d:"ᵈ",e:"ᵉ",f:"ᶠ",g:"ᵍ",h:"ʰ",i:"ⁱ",j:"ʲ",k:"ᵏ",l:"ˡ",
    m:"ᵐ",n:"ⁿ",o:"ᵒ",p:"ᵖ",q:"q",r:"ʳ",s:"ˢ",t:"ᵗ",u:"ᵘ",v:"ᵛ",w:"ʷ",x:"ˣ",y:"ʸ",z:"ᶻ",
    A:"ᴬ",B:"ᴮ",C:"ᶜ",D:"ᴰ",E:"ᴱ",F:"ᶠ",G:"ᴳ",H:"ᴴ",I:"ᴵ",J:"ᴶ",K:"ᴷ",L:"ᴸ",
    M:"ᴹ",N:"ᴺ",O:"ᴼ",P:"ᴾ",Q:"Q",R:"ᴿ",S:"ˢ",T:"ᵀ",U:"ᵁ",V:"ᵛ",W:"ᵂ",X:"ˣ",Y:"ʸ",Z:"ᶻ",
    "0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"
  };
  return pairs;
}

const UNICODE_STYLES = [
  {
    name: "Double Struck",
    preview: () => conv("Abc", makeDoubleStruck()),
    convert: t => conv(t, makeDoubleStruck())
  },
  {
    name: "Cursive Bold",
    preview: () => conv("Abc", makeBoldScript()),
    convert: t => conv(t, makeBoldScript())
  },
  {
    name: "Cursive",
    preview: () => conv("Abc", makeScript()),
    convert: t => conv(t, makeScript())
  },
  {
    name: "Gothique",
    preview: () => conv("Abc", makeFraktur()),
    convert: t => conv(t, makeFraktur())
  },
  {
    name: "Gothique Bold",
    preview: () => conv("Abc", makeBoldFraktur()),
    convert: t => conv(t, makeBoldFraktur())
  },
  {
    name: "Gras",
    preview: () => conv("Abc", makeBold()),
    convert: t => conv(t, makeBold())
  },
  {
    name: "Italique",
    preview: () => conv("Abc", makeItalic()),
    convert: t => conv(t, makeItalic())
  },
  {
    name: "Gras Italique",
    preview: () => conv("Abc", makeBoldItalic()),
    convert: t => conv(t, makeBoldItalic())
  },
  {
    name: "Monospace",
    preview: () => conv("Abc", makeMono()),
    convert: t => conv(t, makeMono())
  },
  {
    name: "Fullwidth",
    preview: () => conv("Abc", makeFullwidth()),
    convert: t => conv(t, makeFullwidth())
  },
  {
    name: "Cerclé",
    preview: () => conv("Abc", makeCircled()),
    convert: t => conv(t, makeCircled())
  },
  {
    name: "Sᴍᴀʟʟ Cᴀᴘs",
    preview: () => conv("Abc", makeSmallCaps()),
    convert: t => conv(t, makeSmallCaps())
  },
  {
    name: "Superscript",
    preview: () => conv("Abc", makeSuperscript()),
    convert: t => conv(t, makeSuperscript())
  },
  {
    name: "S̶t̶r̶i̶k̶e̶",
    preview: () => "S̶t̶r̶",
    convert: t => [...t].map(c => c===" " ? c : c+"\u0336").join("")
  },
  {
    name: "U͟n͟d͟e͟r͟l͟i͟n͟e͟",
    preview: () => "U͟n͟d͟",
    convert: t => [...t].map(c => c===" " ? c : c+"\u035F").join("")
  },
  {
    name: "uʍopǝpısdn",
    preview: () => "ɐqɔ",
    convert: t => {
      const flip={a:"ɐ",b:"q",c:"ɔ",d:"p",e:"ǝ",f:"ɟ",g:"ƃ",h:"ɥ",i:"ᴉ",j:"ɾ",k:"ʞ",l:"l",
        m:"ɯ",n:"u",o:"o",p:"d",q:"b",r:"ɹ",s:"s",t:"ʇ",u:"n",v:"ʌ",w:"ʍ",x:"x",y:"ʎ",z:"z",
        A:"∀",B:"ᗺ",C:"Ɔ",D:"ᗡ",E:"Ǝ",F:"Ⅎ",G:"⅁",H:"H",I:"I",J:"ɾ",K:"ʞ",L:"⅂",
        M:"W",N:"N",O:"O",P:"Ԁ",Q:"Q",R:"ᴚ",S:"S",T:"⊥",U:"∩",V:"Λ",W:"M",X:"X",Y:"⅄",Z:"Z",
        "1":"Ɩ","2":"ᄅ","3":"Ɛ","4":"ㄣ","5":"ϛ","6":"9","7":"ㄥ","8":"8","9":"6","0":"0",
        ".":"˙",",":"'","?":"¿","!":"¡"};
      return [...t].reverse().map(c=>flip[c]||c).join("");
    }
  },
  {
    name: "Z̴a̷l̷g̷o̷",
    preview: () => "Z̴a̷l̷",
    convert: t => {
      const ab=["̈","̉","̊","̋","̌","̍","̎","̏","̐","̑","̒","̓","̕","̚"];
      const bl=["̡","̢","̣","̤","̥","̦","̧","̩","̪","̫","̬","̭"];
      return [...t].map(c=>{
        if(c===" ")return c;
        let r=c;
        const n=Math.floor(Math.random()*3)+1;
        for(let i=0;i<n;i++)r+=ab[Math.floor(Math.random()*ab.length)];
        if(Math.random()>.5)r+=bl[Math.floor(Math.random()*bl.length)];
        return r;
      }).join("");
    }
  },
];

// =====================================================
// ÉTAT
// =====================================================
let state = { font:FONTS[0], unicode:null, size:32, color:"#e8e8f0", tab:"fonts" };

// =====================================================
// INIT polices
// =====================================================
const fontGrid = document.getElementById("font-grid");
FONTS.forEach((font,i)=>{
  const btn=document.createElement("button");
  btn.className="font-btn"+(i===0?" active":"");
  btn.innerHTML=`<span class="preview" style="font-family:${font.family}">Bonjour</span><span class="name">${font.name}</span>`;
  btn.addEventListener("click",()=>{
    fontGrid.querySelectorAll(".font-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    state.font=font; state.unicode=null;
    updatePreview();
  });
  fontGrid.appendChild(btn);
});

// =====================================================
// INIT unicode
// =====================================================
const unicodeGrid = document.getElementById("unicode-grid");
UNICODE_STYLES.forEach((style,i)=>{
  const btn=document.createElement("button");
  btn.className="font-btn";
  btn.innerHTML=`<span class="preview">${style.preview()}</span><span class="name">${style.name}</span>`;
  btn.addEventListener("click",()=>{
    unicodeGrid.querySelectorAll(".font-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    state.unicode=style;
    updatePreview();
  });
  unicodeGrid.appendChild(btn);
});

// =====================================================
// TABS
// =====================================================
function switchTab(tab){
  state.tab=tab;
  document.querySelectorAll(".tab").forEach((t,i)=>{
    t.classList.toggle("active",(i===0&&tab==="fonts")||(i===1&&tab==="unicode"));
  });
  document.getElementById("panel-fonts").classList.toggle("active",tab==="fonts");
  document.getElementById("panel-unicode").classList.toggle("active",tab==="unicode");
  document.getElementById("size-card").style.opacity=tab==="unicode"?"0.4":"1";
  document.getElementById("size-card").style.pointerEvents=tab==="unicode"?"none":"";
  document.getElementById("unicode-badge").style.display=tab==="unicode"?"":"none";
  document.getElementById("btn-html").style.display=tab==="unicode"?"none":"";
  updatePreview();
}

// =====================================================
// COULEURS
// =====================================================
const COLORS=["#e8e8f0","#a78bfa","#34d399","#f472b6","#fb923c","#38bdf8","#facc15","#f87171","#000000","#ffffff"];
const colorRow=document.getElementById("color-row");
COLORS.forEach((color,i)=>{
  const sw=document.createElement("div");
  sw.className="color-swatch"+(i===0?" active":"");
  sw.style.background=color;
  if(color==="#ffffff")sw.style.border="2px solid #444";
  sw.addEventListener("click",()=>{
    colorRow.querySelectorAll(".color-swatch").forEach(s=>s.classList.remove("active"));
    sw.classList.add("active"); state.color=color; updatePreview();
  });
  colorRow.appendChild(sw);
});
const picker=document.createElement("input");
picker.type="color"; picker.value="#a78bfa"; picker.title="Couleur personnalisée";
picker.addEventListener("input",()=>{
  colorRow.querySelectorAll(".color-swatch").forEach(s=>s.classList.remove("active"));
  state.color=picker.value; updatePreview();
});
colorRow.appendChild(picker);

// =====================================================
// TAILLE
// =====================================================
const sizeRange=document.getElementById("size-range");
const sizeDisplay=document.getElementById("size-display");
sizeRange.addEventListener("input",()=>{
  state.size=parseInt(sizeRange.value);
  sizeDisplay.textContent=state.size+"px";
  updatePreview();
});
document.getElementById("input-text").addEventListener("input",updatePreview);

// =====================================================
// APERÇU
// =====================================================
function getConverted(){
  const raw=document.getElementById("input-text").value;
  if(!raw.trim())return"";
  return state.unicode ? state.unicode.convert(raw) : raw;
}

function updatePreview(){
  const area=document.getElementById("preview-area");
  const converted=getConverted();
  if(!converted){
    area.innerHTML='<span id="preview-empty">L\'aperçu apparaît ici…</span>';
    area.style.fontFamily=""; area.style.fontSize=""; return;
  }
  area.innerHTML="";
  area.style.color=state.color;
  if(state.unicode){
    area.style.fontFamily="inherit";
    area.style.fontSize="1.6rem";
  }else{
    area.style.fontFamily=state.font.family;
    area.style.fontSize=state.size+"px";
  }
  area.textContent=converted;
}

// =====================================================
// ACTIONS
// =====================================================
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2200);
}

function copyText(){
  const text=getConverted();
  if(!text)return;
  navigator.clipboard.writeText(text).then(()=>showToast("✓ Texte copié !"));
}

function copyHTML(){
  const text=document.getElementById("input-text").value.trim();
  if(!text||state.unicode)return;
  const html=`<span style="font-family:${state.font.family};font-size:${state.size}px;color:${state.color}">${text}</span>`;
  navigator.clipboard.writeText(html).then(()=>showToast("✓ HTML copié !"));
}

function downloadPNG(){
  const text=getConverted();
  if(!text)return;
  const canvas=document.createElement("canvas");
  const ctx=canvas.getContext("2d");
  const fs=state.unicode?48:state.size*2;
  const ff=state.unicode?"system-ui, sans-serif":state.font.family.replace(/'/g,'"');
  ctx.font=`${fs}px ${ff}`;
  const lines=text.split("\n");
  const lineH=fs*1.5;
  const maxW=Math.max(...lines.map(l=>ctx.measureText(l).width));
  canvas.width=maxW+60; canvas.height=lines.length*lineH+40;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.font=`${fs}px ${ff}`;
  ctx.fillStyle=state.color; ctx.textBaseline="top";
  lines.forEach((line,i)=>ctx.fillText(line,30,20+i*lineH));
  const link=document.createElement("a");
  link.download="texte.png"; link.href=canvas.toDataURL("image/png"); link.click();
  showToast("✓ PNG téléchargé !");
}

function resetAll(){
  document.getElementById("input-text").value="";
  sizeRange.value=32; sizeDisplay.textContent="32px";
  state={font:FONTS[0],unicode:null,size:32,color:"#e8e8f0",tab:"fonts"};
  fontGrid.querySelectorAll(".font-btn").forEach((b,i)=>b.classList.toggle("active",i===0));
  unicodeGrid.querySelectorAll(".font-btn").forEach(b=>b.classList.remove("active"));
  colorRow.querySelectorAll(".color-swatch").forEach((s,i)=>s.classList.toggle("active",i===0));
  switchTab("fonts");
  updatePreview();
}

updatePreview();
</script>
